[package]
name = "omloom-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
diagnostics = ["omloom-store/diagnostics"]
embedded-sid = ["dep:coordinode-embed", "dep:sid", "dep:sid-crypto", "dep:sid-plugin", "dep:sid-storage"]

[[bin]]
name = "omloom-dev"
path = "src/main.rs"

[[example]]
name = "search_probe"
required-features = ["diagnostics"]

[dependencies]
omloom-contracts = { path = "../omloom-contracts" }
omloom-store = { path = "../omloom-store" }
prost.workspace = true
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-types = "0.14.6"
tonic-web = "0.14.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
axum = "0.8.9"
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
webpki-roots = "1"
coordinode-embed = { version = "0.10.1", optional = true }
sid = { package = "structured-id", git = "https://github.com/structured-id/sid", rev = "8ee2878ef01c1ef2b0757590b02f60ed4aaee666", optional = true }
sid-crypto = { git = "https://github.com/structured-id/sid", rev = "8ee2878ef01c1ef2b0757590b02f60ed4aaee666", default-features = false, features = ["primitives", "jwt-rustcrypto", "tls-rustcrypto"], optional = true }
sid-plugin = { git = "https://github.com/structured-id/sid", rev = "8ee2878ef01c1ef2b0757590b02f60ed4aaee666", optional = true }
sid-storage = { git = "https://github.com/structured-id/sid", rev = "8ee2878ef01c1ef2b0757590b02f60ed4aaee666", default-features = false, features = ["storage-coordinode"], optional = true }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "sid_host"
required-features = ["embedded-sid"]

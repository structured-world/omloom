[package]
name = "omloom-store"
description = "Disk-backed current inventory and durable operation storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["dep:coordinode-embed", "dep:coordinode-core", "dep:omloom-contracts", "dep:sha2", "dep:prost", "dep:csv", "dep:ipnet"]
diagnostics = ["std"]

[dependencies]
coordinode-embed = { version = "=0.9.0", optional = true }
coordinode-core = { version = "=0.9.0", optional = true }
omloom-contracts = { path = "../omloom-contracts", optional = true }
sha2 = { version = "0.10", optional = true }
prost = { workspace = true, optional = true }
csv = { version = "1.4", optional = true }
ipnet = { version = "2.12", optional = true }

[dev-dependencies]
coordinode-storage = "=0.9.0"
tempfile = "3"
prost.workspace = true
criterion = "0.8"

[[test]]
name = "disk"
required-features = ["diagnostics"]

[[bench]]
name = "retrieval"
harness = false
required-features = ["std"]

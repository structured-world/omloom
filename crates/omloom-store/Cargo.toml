[package]
name = "omloom-store"
description = "Disk-backed current inventory and durable operation storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["dep:coordinode-embed", "dep:coordinode-core", "dep:omloom-contracts", "dep:sha2", "dep:prost", "dep:csv", "dep:ipnet"]
diagnostics = ["std"]

[dependencies]
coordinode-embed = { git = "https://github.com/structured-world/coordinode", rev = "1862962a3da20e5e57d7ab5126e69bd5817d7c61", optional = true }
coordinode-core = { git = "https://github.com/structured-world/coordinode", rev = "1862962a3da20e5e57d7ab5126e69bd5817d7c61", optional = true }
omloom-contracts = { path = "../omloom-contracts", optional = true }
sha2 = { version = "0.10", optional = true }
prost = { workspace = true, optional = true }
csv = { version = "1.4", optional = true }
ipnet = { version = "2.12", optional = true }

[dev-dependencies]
coordinode-storage = { git = "https://github.com/structured-world/coordinode", rev = "1862962a3da20e5e57d7ab5126e69bd5817d7c61" }
tempfile = "3"
prost.workspace = true
criterion = "0.8"

[[test]]
name = "disk"
required-features = ["diagnostics"]

[[test]]
name = "workspace"
required-features = ["diagnostics"]

[[bench]]
name = "retrieval"
harness = false
required-features = ["std"]

[[example]]
name = "workspace_bench"
required-features = ["diagnostics"]

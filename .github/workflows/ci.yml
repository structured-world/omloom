name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    name: Documentation
    if: github.repository_owner == 'structured-world' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, light]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-docs.sh

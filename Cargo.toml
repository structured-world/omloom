[workspace]
members = ["crates/omloom-contracts"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/structured-world/omloom"

[workspace.dependencies]
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
uuid = { version = "1", features = ["v7"] }

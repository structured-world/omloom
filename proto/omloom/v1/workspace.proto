syntax = "proto3";
package omloom.workspace.v1;
import "omloom/v1/contracts.proto";

// The same typed application surface is used by the development browser and
// future authenticated hosts. Requests never carry an actor or effective grant.
service Workspace {
  rpc Call(Request) returns (Reply);
}

enum View {
  VIEW_OVERVIEW = 0;
  VIEW_NETWORK = 1;
  VIEW_HARDWARE = 2;
  VIEW_VIRTUALIZATION = 3;
  VIEW_SERVICES = 4;
}
// Explicit current role of an OS installation, independently of its product name.
// Missing or unspecified means unknown, not disabled virtualization.
enum VirtualizationRole {
  // No assertion about installed and enabled virtualization.
  VIRTUALIZATION_ROLE_UNSPECIFIED = 0;
  // The installation has the required virtualization components installed and enabled.
  VIRTUALIZATION_ROLE_HYPERVISOR = 1;
  // Known not to be an active hypervisor, including absent or disabled components.
  VIRTUALIZATION_ROLE_NOT_HYPERVISOR = 2;
}
enum FieldType {
  FIELD_TYPE_TEXT = 0;
  FIELD_TYPE_INTEGER = 1;
  FIELD_TYPE_BOOLEAN = 2;
  FIELD_TYPE_DATE = 3;
  FIELD_TYPE_CHOICE = 4;
}
enum SharedUse {
  SHARED_USE_UNSPECIFIED = 0;
  SHARED_USE_EXCLUSIVE = 1;
  SHARED_USE_VRRP = 2;
  SHARED_USE_ANYCAST = 3;
}

message Predicate {
  // User-selected built-in name or stable company definition UUID.
  string field = 1;
  // User-selected typed equality operand; an explicit clear tests a cleared value.
  omloom.v1.Field value = 2;
  // Reviewed interpretation generation, absent for built-ins. Label/help edits
  // preserve it; type, choice or applicability migration invalidates it.
  optional uint64 definition_generation = 3;
}
message Query {
  // User-selected presentation; it never grants access or changes adoption.
  View view = 1;
  // Selected root identities; an empty set means all currently permitted inventory.
  repeated omloom.v1.AssetRef roots = 2;
  // User-selected supported resource kinds; empty means all kinds in this view.
  repeated omloom.v1.AssetKind kinds = 3;
  // User input for exact identity/IP or selected descriptive discovery.
  string search = 4;
  // Explicit typed conditions; unavailable conditions are errors, never discarded.
  repeated Predicate predicates = 5;
  // Requested built-in/definition fields; omission uses the documented name column.
  repeated string columns = 6;
  // User-selected supported ordering: name or kind, with stable ID ties.
  string sort = 7;
  // Requested direction of the selected sort, with the same stable tie ordering.
  bool descending = 8;
  // Opaque server cursor from the preceding page; not an authority token.
  optional string cursor = 9;
  // Requested page size, constrained by the server's fixed resource ceiling.
  uint32 limit = 10;
  // Explicit selection of objects without a confirmed physical placement.
  bool unplaced = 11;
  // Explicit resource perspective within roots, rechecked by the server. Only
  // its local components are projected; upstream topology is not inferred.
  optional omloom.v1.AssetRef focus = 12;
  // Request bounded owner/address context for visible rows, not additional authority.
  bool include_context = 13;
  // Ordinary inventory presentation omits host-local address resources before pagination.
  // This is a projection choice, not an authorization grant or removal of source evidence.
  bool omit_host_local = 14;
  // Browse one ownership level: root containers when no scope is selected,
  // otherwise direct children of roots/focus. View and kind filters apply before
  // count/pagination. Explicit search may request a flat scoped result instead.
  // This changes presentation only and never grants resource/field authority.
  bool level_only = 15;
  // Exact issuer-qualified effective responsibility filter, applied before totals
  // and pagination. Only a permitted facet can contribute a matching resource.
  optional ResponsibilityFilter responsibility = 16;
}
message ResponsibilityFilter {
  // Independent owner/operator facet selected by the user; never a permission selector.
  ResponsibilityFacet facet = 1;
  // Source namespace of the selected party, max 256 bytes.
  string issuer = 2;
  // Stable party identity within issuer, max 256 bytes, not its display name.
  string subject = 3;
}

message WorkingContext {
  // User-selected enclosing roots. Empty explicitly selects all permitted
  // inventory; this selector never supplies resource or field authority.
  repeated omloom.v1.AssetRef roots = 1;
  // Current local resource, if any. Creation refines it; peer edits require an
  // explicit context encompassing both endpoints without this local focus.
  optional omloom.v1.AssetRef focus = 2;
  // Application revision reviewed for scoped mutations. Required with roots
  // or focus; omit for retrieval. The server rechecks membership at commit.
  optional uint64 expected = 3;
}
// Read-only review of a placement already changed outside Omloom. This request
// never executes a hypervisor migration or changes the guest's addresses.
message PrepareVmPlacement {
  // User-selected existing VM incarnation, never identified by its current IP.
  omloom.v1.AssetRef vm = 1;
  // Optional proposed enabled hypervisor installation. Omit to read the actual
  // current placement before choosing a destination in the enclosing context.
  optional omloom.v1.AssetRef destination = 2;
}
message VmPlacementReview {
  // Current application basis, echoed as WorkingContext.expected on acceptance.
  uint64 revision = 1;
  // Exact permitted VM identity/name and accepted inventory revision.
  Item vm = 2;
  // Actual current placement and its conditional edit revision. Absent only
  // when no placement exists; a hidden endpoint makes the review unavailable.
  optional omloom.v1.Relation current = 3;
  // Independently permitted actual old host, including a legacy device host.
  optional Item current_host = 4;
  // Independently permitted proposed enabled hypervisor installation.
  optional Item destination = 5;
  // Permitted currently resolved facets whose explicit old placement binding
  // becomes unavailable after a move. Contacts and source references are omitted;
  // no owner is copied to the destination.
  repeated EffectiveResponsibility invalidated_inheritance = 6;
  // Bounded permitted hardware-owner paths and local interface addresses for
  // the actual old and proposed hosts, consistent with this review's revision.
  repeated ItemContext contexts = 7;
}
message Prepare {
  // User-selected presentation used to suggest applicable creation actions;
  // the server derives actual parent, kind and field permissions independently.
  View view = 1;
  // Explicit relationship source selected in the working context; supply both
  // endpoints to obtain their actual permitted typed relationship choices.
  optional omloom.v1.AssetRef from = 2;
  // Explicit relationship destination; neither endpoint expands the selector.
  optional omloom.v1.AssetRef to = 3;
}

// A selected business reference, never an authentication subject or access grant.
enum PartyKind {
  PARTY_KIND_UNSPECIFIED = 0;
  PARTY_KIND_INDIVIDUAL = 1;
  PARTY_KIND_ORGANIZATION = 2;
  PARTY_KIND_TEAM = 3;
}
message PartyRef {
  // Source namespace supplied with the selected reference, max 256 UTF-8 bytes.
  // Equal names in different namespaces never identify the same party.
  string issuer = 1;
  // Stable opaque identity within issuer, max 256 bytes; not a display name.
  string subject = 2;
  // Declared business-party type; it establishes neither legal title nor SID membership.
  PartyKind kind = 3;
  // User/source-supplied label for this resource's reference, max 160 bytes.
  // A label change preserves issuer and subject and grants no additional rights.
  string name = 4;
}
enum ResponsibilityFacet {
  RESPONSIBILITY_FACET_UNSPECIFIED = 0;
  RESPONSIBILITY_FACET_CLAIMED_OWNER = 1;
  RESPONSIBILITY_FACET_OPERATOR = 2;
  RESPONSIBILITY_FACET_BENEFICIARY = 3;
  RESPONSIBILITY_FACET_ACCOUNT_CONTROLLER = 4;
  // Explicitly reviewed creator attribution, never inferred from deployment labels,
  // directory ownership or the person recording inventory. Never inherits.
  RESPONSIBILITY_FACET_CREATOR = 5;
}
enum AssignmentMode {
  ASSIGNMENT_MODE_UNSPECIFIED = 0;
  ASSIGNMENT_MODE_EXPLICIT = 1;
  ASSIGNMENT_MODE_INHERIT = 2;
  ASSIGNMENT_MODE_UNASSIGNED = 3;
}
// User-declared syntax for a locator. Parsing never proves ownership or delivery.
enum LocatorKind {
  // An opaque route or constraint, including older values without a declared type.
  LOCATOR_KIND_UNSPECIFIED = 0;
  // One SMTP mailbox, without display-name syntax or provider normalization.
  LOCATOR_KIND_EMAIL = 1;
  // One valid international telephone number in E.164 form, with no inferred country.
  LOCATOR_KIND_PHONE = 2;
  // One HTTP(S) contact URL without embedded credentials; never fetched by validation.
  LOCATOR_KIND_WEB = 3;
  // One DNS name. Public suffix recognition is not proof of registration.
  LOCATOR_KIND_DOMAIN = 4;
}
message ResponsibilityAssignment {
  // User-selected independent facet; only claimed owner and operator may inherit.
  ResponsibilityFacet facet = 1;
  // Explicit assignment, qualified downward inheritance or an explicit unassigned stop.
  // Absence of a local row is interpreted by the component contract, never as the creator.
  AssignmentMode mode = 2;
  // Selected source-qualified party, required only for EXPLICIT.
  optional PartyRef party = 3;
  // Existing accepted relation chosen as an administrative inheritance source.
  // Omit when the component contract determines the source unambiguously.
  // The server derives its endpoints and rejects peer, network and dependency edges.
  optional string source_relation = 4;
  // Current relation revision reviewed by the user when selecting source_relation.
  // Required with that selector on writes; never interpreted as authorization.
  optional uint64 source_revision = 5;
  // Explicit optional responsibility route, max 512 bytes, separately disclosed
  // from the assignment. A route is not automatically an approver or a credential.
  optional string contact = 6;
  // User-selected syntax of contact; unspecified preserves an opaque route.
  // Requires contact and shares its read/write permissions.
  LocatorKind contact_kind = 7;
}
enum ResponsibilityStatus {
  RESPONSIBILITY_STATUS_UNSPECIFIED = 0;
  RESPONSIBILITY_STATUS_EXPLICIT = 1;
  RESPONSIBILITY_STATUS_INHERITED = 2;
  RESPONSIBILITY_STATUS_UNASSIGNED = 3;
  RESPONSIBILITY_STATUS_UNKNOWN = 4;
  RESPONSIBILITY_STATUS_AMBIGUOUS = 5;
  RESPONSIBILITY_STATUS_SOURCE_UNAVAILABLE = 6;
}
message EffectiveResponsibility {
  // Independent facet requested by the caller and authorized on the selected resource.
  ResponsibilityFacet facet = 1;
  // Server-derived current resolution; unknown and an explicit stop are distinct.
  ResponsibilityStatus status = 2;
  // Effective value permitted on this child; its visibility does not disclose the parent.
  optional PartyRef party = 3;
  // Source resource, present only with independent permission to disclose its identity.
  optional omloom.v1.AssetRef source = 4;
  // Source's accepted inventory revision, present only with that source disclosure.
  optional uint64 source_revision = 5;
  // Current route, returned only with separate contact permission on the selected resource.
  optional string contact = 6;
  // Server-returned declared syntax, disclosed only together with contact.
  LocatorKind contact_kind = 7;
}
message Responsibility {
  // Exact resource incarnation selected for reading or editing, never inferred from a name.
  omloom.v1.AssetRef target = 1;
  // Reviewed resource revision. Omit for reads; required for a mutation with changes.
  optional uint64 expected = 2;
  // Explicit local changes; omitted facets retain their assignments. Empty means read.
  // The server derives effective inheritance and never accepts client-computed ownership.
  repeated ResponsibilityAssignment changes = 3;
  // Explicitly request a read, a non-persistent preview or an accepted mutation.
  // Unspecified is rejected; supplying changes alone never authorizes a write.
  ResponsibilityAction action = 4;
  // Request source choices only when preparing an edit; ordinary labels need no picker data.
  bool include_sources = 5;
}
enum ResponsibilityAction {
  RESPONSIBILITY_ACTION_UNSPECIFIED = 0;
  RESPONSIBILITY_ACTION_READ = 1;
  RESPONSIBILITY_ACTION_PREVIEW = 2;
  RESPONSIBILITY_ACTION_APPLY = 3;
}
message ResponsibilityState {
  // Existing selected resource and its current edit revision; no new party inventory.
  Item item = 1;
  // Permitted local declarations. Missing declarations do not imply permission to set them.
  repeated ResponsibilityAssignment assignments = 2;
  // Current field-authorized resolution with independently restricted source references.
  repeated EffectiveResponsibility effective = 3;
  // Facets writable under the trusted host decision, not rights inferred from ownership.
  repeated ResponsibilityFacet writable = 4;
  // Current application basis for preview/import and conditional acceptance.
  uint64 revision = 5;
  // Bounded actual downward source choices, independently filtered for disclosure.
  repeated ResponsibilitySource sources = 6;
  // Facets whose local declaration and contact are both readable. A replacement
  // form requires this disclosure independently of the caller's write permission.
  repeated ResponsibilityFacet fully_readable = 7;
}
message ResponsibilitySource {
  // Existing accepted relation and current revision selected as the inheritance basis.
  omloom.v1.Relation relation = 1;
  // Permitted source identity/name only, not its other fields or contacts.
  Item parent = 2;
  // Facets for which this source can currently be explicitly selected.
  repeated ResponsibilityFacet facets = 3;
}
message ResponsibilityTransfer {
  // Finite selected export or reviewed import, max 100 exact resource entries.
  // All entries use the same action and commit atomically; preview never persists.
  repeated Responsibility entries = 1;
}
message ResponsibilityTransferState {
  // Independently filtered declarations for the exact selected identities.
  repeated ResponsibilityState entries = 1;
  // Application revision shared by the complete bounded transfer.
  uint64 revision = 2;
}

enum ExternalAccountKind {
  EXTERNAL_ACCOUNT_KIND_UNSPECIFIED = 0;
  EXTERNAL_ACCOUNT_KIND_ADMINISTRATION = 1;
  EXTERNAL_ACCOUNT_KIND_PROGRAMMATIC = 2;
}
enum AccountDelegation {
  ACCOUNT_DELEGATION_UNSPECIFIED = 0;
  ACCOUNT_DELEGATION_OWNER_ONLY = 1;
  ACCOUNT_DELEGATION_SCOPED = 2;
}
message AccountMetadata {
  // Provider namespace for this selected account, max 256 bytes; not a secret endpoint.
  string issuer = 1;
  // Provider-generated stable account identity, max 256 bytes, never a password.
  string subject = 2;
  // Human administration and workload principals have different authority boundaries.
  ExternalAccountKind kind = 3;
  // Reviewed provider capability. Unspecified means unknown, never owner-only or delegated.
  AccountDelegation delegation = 4;
  // Permitted selected login label, max 256 bytes; not an authentication credential.
  optional string login = 5;
  // Known sender constraint for the selected SMTP account, max 256 bytes.
  optional string sender = 6;
  // Host-configured opaque credential binding UUID, never a vault path or secret.
  optional string credential_binding_id = 7;
  // Known public provider recovery/transfer route, max 512 bytes; no recovery answers.
  optional string recovery_route = 8;
  // User-selected sender constraint syntax: email, domain or unspecified opaque text.
  // Requires sender and shares its independent field permissions.
  LocatorKind sender_kind = 9;
  // User-selected recovery route syntax, disclosed and editable with recovery_route.
  // Requires recovery_route; validation neither contacts a provider nor proves authority.
  LocatorKind recovery_route_kind = 10;
}
enum AccountLinkKind {
  ACCOUNT_LINK_KIND_UNSPECIFIED = 0;
  ACCOUNT_LINK_KIND_MANAGED_RESOURCE = 1;
  ACCOUNT_LINK_KIND_SERVICE = 2;
  ACCOUNT_LINK_KIND_ENDPOINT = 3;
  ACCOUNT_LINK_KIND_CONSUMER = 4;
}
message AccountLink {
  // Explicit relationship meaning; none of these bindings transfers ownership or grants.
  AccountLinkKind kind = 1;
  // Selected existing resource and incarnation, checked independently for disclosure/editing.
  omloom.v1.AssetRef target = 2;
}
enum AccountCapability {
  ACCOUNT_CAPABILITY_UNSPECIFIED = 0;
  ACCOUNT_CAPABILITY_SHARE_REFERENCE = 1;
  ACCOUNT_CAPABILITY_WORKLOAD_USE = 2;
  ACCOUNT_CAPABILITY_REVEAL_SECRET = 3;
  ACCOUNT_CAPABILITY_ROTATE = 4;
  ACCOUNT_CAPABILITY_DELEGATE = 5;
  ACCOUNT_CAPABILITY_REQUEST_CHANGE = 6;
  ACCOUNT_CAPABILITY_APPROVE_CHANGE = 7;
  ACCOUNT_CAPABILITY_EXECUTE_CHANGE = 8;
}
message ExternalAccount {
  // Selected account resource. Ordinary asset creation supplies its stable identity.
  omloom.v1.AssetRef target = 1;
  // Required for edits, omitted for reads. Bound to the account's accepted revision.
  optional uint64 expected = 2;
  // Explicit current metadata replacement. Omit to preserve metadata when editing links.
  optional AccountMetadata metadata = 3;
  // Explicit additions, max 32. Omitted and hidden bindings are preserved.
  repeated AccountLink add = 4;
  // Explicit removals, max 32, each requiring current endpoint rights.
  repeated AccountLink remove = 5;
  // Server continuation for the account's bounded request list. Reads only.
  optional string requests_cursor = 6;
}
message ExternalAccountState {
  // Permitted account identity/type and its current revision.
  Item item = 1;
  // Only independently permitted metadata fields. No credential is fetched or transmitted.
  optional AccountMetadata metadata = 2;
  // Currently disclosable selected bindings; omission never proves absence elsewhere.
  repeated AccountLink links = 3;
  // Independent host decisions, not provider execution qualification or secret availability.
  repeated AccountCapability authorized = 4;
  // Explicit metadata/link fields writable in this context.
  repeated string writable = 5;
  // Current application revision for conditional editing.
  uint64 revision = 6;
  // Names/kinds for the permitted link targets, fetched together for this card.
  repeated Item related = 7;
  // Bounded durable request summaries. Arguments are read only when opening a request.
  repeated omloom.v1.Operation requests = 8;
  // Revision/authority-bound continuation for further current requests.
  optional string requests_next = 9;
  // Server-derived disclosure completeness for the whole metadata record.
  // True only when every metadata field is readable, independently of write
  // permission. Whole-record editors require this so an undisclosed optional
  // value cannot silently become an explicit clear; it grants no write authority.
  bool metadata_fully_readable = 10;
}
enum OwnerRequestAction {
  OWNER_REQUEST_ACTION_UNSPECIFIED = 0;
  OWNER_REQUEST_ACTION_CREATE = 1;
  OWNER_REQUEST_ACTION_READ = 2;
  OWNER_REQUEST_ACTION_APPROVE = 3;
  OWNER_REQUEST_ACTION_REPORT = 4;
}
message OwnerRequest {
  // Explicit request transition; no transition dispatches an external effect.
  OwnerRequestAction action = 1;
  // Selected account used for the change, checked independently from its resource.
  omloom.v1.AssetRef account = 2;
  // Exact existing resource. Required for creation; subsequent calls use the saved operation.
  optional omloom.v1.AssetRef target = 3;
  // Reviewed account revision, required at creation and every subsequent mutation.
  optional uint64 account_revision = 4;
  // Reviewed target revision, required at creation. A stale target cannot be approved/reported.
  optional uint64 target_revision = 5;
  // Explicit provider action token, max 64 ASCII bytes; no executable command.
  string change = 6;
  // Exact non-secret proposed arguments, bounded by the durable operation contract.
  repeated omloom.v1.Field arguments = 7;
  // Caller-selected idempotency key for creation, max 256 bytes.
  string retry_key = 8;
  // User-selected request deadline in Unix milliseconds; expiration does not prove an effect.
  uint64 expires_at_ms = 9;
  // Existing durable operation UUID, required except at creation.
  optional string operation_id = 10;
  // Reviewed operation revision, required for approval/report.
  optional uint64 expected = 11;
  // Explicit owner assertion of effect knowledge. Unknown remains unknown;
  // confirmed is an assertion, never independent provider verification.
  omloom.v1.EffectOutcome reported_outcome = 12;
}
message OwnerRequestState {
  // Existing durable operation projection; a report remains pending verification.
  omloom.v1.Operation operation = 1;
  // Exact saved non-secret change arguments, returned only with request-read permission.
  repeated omloom.v1.Field arguments = 2;
  // Saved provider action token, not a dispatched action.
  string change = 3;
  // Current approval fact, independently attributed in operation evidence.
  bool approved = 4;
  // An owner supplied an assertion; this is never provider-verified success.
  bool owner_reported = 5;
  // False when current field rights omit proposed arguments. Such a projection
  // cannot be approved/reported as if the complete requested change were visible.
  bool arguments_complete = 6;
}
message Creation {
  // Server-qualified resource kind available at this exact parent/context.
  omloom.v1.AssetKind kind = 1;
  // Actual parent and its permitted name, absent for standalone inventory.
  // The user selects one returned parent when the scope contains several.
  optional Item parent = 2;
  // Applicable writable built-ins and stable company field identities. Omitted
  // fields are preserved; a parent grants neither their values nor permissions.
  repeated string fields = 3;
  // Explicit Prefix context for known-address creation, with only permitted
  // current discriminators. This supplies membership, never ownership or grants.
  optional Item prefix_context = 4;
}
message Actions {
  // Server-derived bounded creation choices, never a client authority assertion.
  repeated Creation creations = 1;
  // Exact application revision of the prepared choices, echoed for mutations.
  uint64 revision = 2;
  // Typed relationship kinds applicable to the requested exact endpoint pair.
  repeated omloom.v1.RelationKind relationships = 3;
  // Writable fields of the focused existing resource, absent without a focus.
  // These are server-derived form inputs, never inherited from its parent.
  repeated string fields = 4;
  // Explicit allocation choices within the selected namespace/prefix or L2
  // domain. Separate from recording locally known address facts.
  repeated Creation allocations = 5;
}
message Item {
  // Server-owned stable local asset identity and lifetime.
  omloom.v1.AssetRef target = 1;
  // Server-validated actual kind of the resource.
  omloom.v1.AssetKind kind = 2;
  // Current accepted-intent revision for conditional editing.
  uint64 revision = 3;
  // Only requested and currently visible values; absence is not an explicit clear.
  repeated omloom.v1.Field fields = 4;
}
message Page {
  // Visible requested projections, ordered under this response's revision.
  // A page may contain fewer than the requested row limit to fit the reply byte ceiling.
  repeated Item items = 1;
  // Opaque continuation with query/context revision binding, absent at the end.
  optional string next = 2;
  // Number of permitted matching assets, never hidden candidates.
  uint64 total = 3;
  // Current application revision used to prepare this page or selection.
  uint64 revision = 4;
  // Bounded authorized owner/address hints for this page only, absent unless requested.
  repeated ItemContext contexts = 5;
}
message OwnerContext {
  // Current authorized owner identity; never a fabricated unknown resource.
  omloom.v1.AssetRef target = 1;
  // Actual owner kind, preserving OS/container/host distinctions.
  omloom.v1.AssetKind kind = 2;
  // Permitted current owner label, empty when no name is accepted; no unrelated owner fields.
  string name = 3;
}
message ItemContext {
  // Visible row to which these server-derived hints apply.
  omloom.v1.AssetRef target = 1;
  // Authorized containment path from the enclosing host to the immediate owner.
  repeated OwnerContext owners = 2;
  // Permitted non-local addresses attached to this resource's local interfaces.
  repeated string addresses = 3;
  // Multiple authorized immediate owners at a shared boundary, never a fabricated chain.
  repeated OwnerContext alternative_owners = 5;
  // Actual permitted service binds for this page, independent of configured interface addresses.
  repeated SocketBind endpoints = 6;
  // Current claimed-owner projection for a visible workload/container on this
  // page. Omitted when that facet is undisclosable. A missing party with UNKNOWN
  // differs from an explicit UNASSIGNED stop. Contacts and source identities
  // are not included; this projection is never persisted or an access grant.
  optional EffectiveResponsibility responsibility = 7;
  // Current permitted Prefix CIDR for its title/tooltip when name is requested
  // without cidr in overview/network page context. From the same snapshot;
  // not an accepted name, an allocation proof or another stored value.
  optional string prefix_cidr = 8;
}
message Read {
  // User-selected local target; the server rechecks current scope/incarnation.
  omloom.v1.AssetRef target = 1;
  // Server-issued relation continuation, bound to target, context and current revision.
  optional string relations_cursor = 2;
  // Server-issued network-evidence continuation, bound to this target, working
  // context, authority and current revision. Cannot accompany relations_cursor.
  optional string network_cursor = 3;
}
message Detail {
  // Current visible inventory fields and edit revision.
  Item item = 1;
  // Authorized relations whose endpoints are both disclosable.
  repeated omloom.v1.Relation relations = 2;
  // Current visible source evidence, separate from accepted intent.
  repeated omloom.v1.Observation observed = 3;
  // Visible import proposals, never silently promoted into accepted intent.
  repeated omloom.v1.Observation imported = 4;
  // Authorized current participants; these are intended assignments, not active-gateway observations.
  repeated Participant participants = 5;
  // True only when every intended participant is disclosable in this context.
  bool participants_complete = 6;
  // Visible typed shared-address group and its independent edit revision.
  // Omitted when unshared or inaccessible; omission never proves no other participants.
  optional Item group = 7;
  // Minimal permitted endpoint labels for the returned relations, fetched in
  // one bounded batch. These are projections of existing identities, not copies.
  repeated Item related = 8;
  // Authorized current local network evidence; absent does not establish absence.
  repeated HostNetworkView host_network = 9;
  // Authorized current interface-address facts; no address asset identities or history.
  repeated InterfaceAddressView current_addresses = 10;
  // Next authorized relation page, absent at the end. Each page contains at most 25 relations.
  optional string relations_next = 11;
  // Next byte-bounded network-evidence page, absent at the end. Continuation
  // responses contain only host_network and this cursor. Counts and filters
  // apply to the supplied page; coverage retains its source-collection meaning.
  optional string network_next = 12;
  // Current selected layer-specific identity claims, filtered by identity_evidence
  // field rights. Equality does not establish authenticated identity or access.
  repeated HostIdentityObservation identity = 13;
}

message AddressObservation {
  // Current source value, without a separate inventory identity or historical sample.
  CurrentAddress value = 1;
  // Exact source observation time for this value, Unix milliseconds; never freshened by omission.
  // Absent for migrated partial collections whose old format lost individual dates.
  optional uint64 observed_at = 2;
}
message InterfaceAddressView {
  // Latest source checkpoint and completeness; addresses are carried only in observations below.
  InterfaceAddresses coverage = 1;
  // Current facts with independent dates, including facts omitted from a partial refresh.
  repeated AddressObservation observations = 2;
  // Opaque local source reference, independent of a possibly duplicated display label.
  string source_id = 3;
  // True when legacy facts could not be attributed to one reviewed native binding.
  bool binding_unresolved = 4;
}
message NetworkObservation {
  // Exact source observation time, Unix milliseconds, independent of the latest scan checkpoint.
  uint64 observed_at = 1;
  // Actual boot/session basis at collection; an omitted partial fact retains its prior basis.
  string basis = 2;
  // Exactly one current typed fact. It does not imply reachability or effective packet permission.
  oneof value {
    // Observed service-owned kernel bind.
    SocketBind socket = 3;
    // Observed local routing entry.
    LocalRoute route = 4;
    // Observed application firewall rule.
    ApplicationRule rule = 5;
    // One reported application firewall setting, independently dated.
    FirewallSetting policy = 6;
  }
}
message HostNetworkView {
  // Latest source checkpoint and reported policy/coverage, without duplicated fact arrays.
  HostNetwork coverage = 1;
  // Current facts retain their own exact observation time and boot basis.
  repeated NetworkObservation observations = 2;
  // Authorized current labels for services referenced by these facts, independent of relation pagination.
  repeated OwnerContext services = 3;
  // Opaque local source reference, independent of its display label.
  string source_id = 4;
  // True when migrated current facts have unresolved native source provenance.
  bool binding_unresolved = 5;
}
message FirewallSetting {
  // Reported application policy selector; never an effective per-port verdict.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ENABLED = 1;
    KIND_BLOCK_ALL = 2;
    KIND_ALLOW_BUILTIN_SIGNED = 3;
    KIND_ALLOW_DOWNLOADED_SIGNED = 4;
  }
  // Source-reported setting identity, independent of other optional policies.
  Kind kind = 1;
  // Observed policy value; absence is represented by no observation, not false.
  bool enabled = 2;
}

enum AddressStability {
  ADDRESS_STABILITY_UNSPECIFIED = 0;
  ADDRESS_STABILITY_STABLE = 1;
  ADDRESS_STABILITY_TEMPORARY = 2;
}
enum AddressState {
  ADDRESS_STATE_UNSPECIFIED = 0;
  ADDRESS_STATE_PREFERRED = 1;
  ADDRESS_STATE_DEPRECATED = 2;
}
message CurrentAddress {
  // Source-configured IP literal; not a resource identity or allocation claim.
  string address = 1;
  // Source-known assignment mask; absence means unknown, zero means /0.
  optional uint32 prefix_length = 2;
  // Source-known generation class, independent of preferred/deprecated state.
  // TEMPORARY is classified at collection and rejected before persistence.
  AddressStability stability = 3;
  // Source-known preferred/deprecated state; deprecated does not mean invalid.
  AddressState state = 4;
}
message InterfaceAddresses {
  // Existing interface being observed; no separate address objects are created.
  omloom.v1.AssetRef interface = 1;
  // Selected source label; it grants no authority over the interface.
  string source = 2;
  // Source observation instant in Unix milliseconds, used for stale-write rejection.
  uint64 observed_at = 3;
  // Current non-temporary facts, at most 64. Equal input writes no new versions.
  repeated CurrentAddress addresses = 4;
  // Explicit completeness within this source/interface. Partial input preserves omissions.
  bool complete = 5;
}
message SocketBind {
  // Existing owning service identity in this installation, never a physical Port.
  omloom.v1.AssetRef service = 1;
  // Observed transport, tcp or udp; UDP bind does not prove a server role.
  string protocol = 2;
  // Reported socket family: IPv4, IPv6 or IPv4+IPv6.
  string family = 3;
  // Kernel local literal or wildcard *, including a source-local IPv6 zone.
  string bind = 4;
  // Observed nonzero local transport port, constrained to 65535.
  uint32 port = 5;
  // Source-known literal generation class; wildcard/unknown remains unspecified.
  // Temporary literal binds must be discarded by the collector, never persisted.
  AddressStability address_stability = 6;
  // Source-known preferred/deprecated state, independent of generation class.
  AddressState address_state = 7;
}
message LocalRoute {
  // Source-reported numeric destination; source abbreviations remain explicit.
  string destination = 1;
  // Source-reported next hop, interface reference or link-layer address.
  // Empty when the source reports no next hop, for example an on-link route.
  string gateway = 2;
  // Source-local kernel flags/qualifiers, not a portable routing policy.
  // Empty when none were reported.
  string flags = 3;
  // Interface name/index in the observed OS installation. Empty when absent,
  // for example a Linux blackhole route. Never infer an interface from an IP.
  string interface = 4;
  // Source address family, IPv4 or IPv6.
  string family = 5;
  // Whether the source marks a link-layer/local-host entry, not a network route.
  bool link_layer = 6;
}
message ApplicationRule {
  // Source application path or bundle identity; no basename-based process match.
  string subject = 1;
  // Reported app action, allow incoming or block incoming. Not a packet verdict.
  string action = 2;
}
message HostNetwork {
  // Existing software installation observed by the selected local source.
  omloom.v1.AssetRef installation = 1;
  // Operator-selected source label; cannot assert actor identity or authority.
  string source = 2;
  // Actual source observation time, milliseconds since Unix epoch; not server freshness.
  uint64 observed_at = 3;
  // Source boot/session basis, not a durable OS installation identifier.
  string basis = 4;
  // Selected current service-owned kernel binds, without remote flows or counters.
  repeated SocketBind sockets = 5;
  // Source-local route and link-layer rows, not canonical IPAM or upstream topology.
  repeated LocalRoute routes = 6;
  // Readable application firewall rules, without inferred effective port decisions.
  repeated ApplicationRule rules = 7;
  // Actual partial/verified/failed/blocked socket-source coverage, bounded readable text.
  string socket_coverage = 8;
  // Actual route-source coverage; failed retrieval never means no routes.
  string route_coverage = 9;
  // Actual application-firewall coverage, independent of packet filtering.
  string application_coverage = 10;
  // Actual PF coverage or permission failure; unknown never means disabled.
  string packet_filter_coverage = 11;
  // Reported application firewall enablement; omitted when unreadable.
  optional bool firewall_enabled = 12;
  // Reported application block-all policy; omitted when unreadable.
  optional bool block_all = 13;
  // Reported signed-app policy; omitted when unreadable.
  optional bool allow_builtin_signed = 14;
  // Reported downloaded signed-app policy; omitted when unreadable.
  optional bool allow_downloaded_signed = 15;
  // Source asserts a complete result within its declared socket collection scope.
  bool sockets_complete = 16;
  // Source asserts a complete result within its declared route collection scope.
  bool routes_complete = 17;
  // Source asserts a complete application rules result, independently of PF.
  bool rules_complete = 18;
}
message Participant {
  // Stable local interface identity selected for this canonical address.
  omloom.v1.AssetRef interface = 1;
  // Intended VRRP priority, including 255 for the address owner; never observed election state.
  optional uint32 priority = 2;
}
message Relationship {
  // User-selected typed endpoints and edit revision; authority is assigned by the server.
  omloom.v1.Relation relation = 1;
  // Explicit revision-checked removal of this relationship only.
  bool remove = 2;
}
message InitialAddress {
  // User-known IPv4/IPv6 literal associated with this installation or machine.
  // Interface, VRF and allocation identity remain unknown unless separately supplied.
  string address = 1;
  // User-known assignment mask; absent does not invent a host mask.
  optional uint32 prefix_length = 2;
  // User-known local 802.1Q tag (1-4094), not a globally identified VLAN/L2 domain.
  optional uint32 vlan_tag = 3;
  // Actual reported OS interface name, absent when the interface is unknown.
  // Accepting it creates a logical interface, never a physical connector.
  optional string interface_name = 4;
}
message ObserveProxmox {
  // User-selected HTTPS API origin, optionally ending in /api2/json. Credentials
  // are sent only to this origin; redirects are never followed.
  string endpoint = 1;
  // Explicit Proxmox account including its realm, used only for ticket login.
  string username = 2;
  // Transient password for this request only; never inventory, logs or retained state.
  string password = 3;
  // Explicit Proxmox API token identity, mutually exclusive with ticket login.
  string token_id = 4;
  // Transient API token secret, never included in responses or persisted.
  string token_secret = 5;
}
message ObservedHypervisor {
  // Provider-reported node name, not a physical server identity or a merge key.
  string name = 1;
  // Configured non-local addresses with their actual OS interface names.
  repeated InitialAddress addresses = 2;
  // Provider-reported CPU model when available; absence is unknown.
  optional string cpu_model = 3;
  // Provider-reported physical/assigned memory bytes, not proof of bare-metal placement.
  optional uint64 memory_bytes = 4;
  // Explicit coverage gaps; omissions are never proof of absent configuration.
  repeated string limitations = 5;
}
message ObservationPreview {
  // API-reported Proxmox version. The response is an ephemeral review, not accepted inventory.
  string version = 1;
  // At most 16 authorized nodes. The user chooses the actual installation;
  // names, IPs and hardware hints never merge existing identities automatically.
  repeated ObservedHypervisor nodes = 2;
}
message Write {
  // Existing target for an edit; absent means explicitly create a new identity.
  optional omloom.v1.AssetRef target = 1;
  // Revision read by the user; required for edits and absent for creation.
  optional uint64 expected = 2;
  // User-selected resource kind for creation; existing kind cannot change here.
  omloom.v1.AssetKind kind = 3;
  // Explicit set/clear changes. Omitted fields are preserved, not cleared.
  repeated omloom.v1.Field changes = 4;
  // Explicit existing parent selected for creation in an enclosing context.
  // The server derives the typed attachment and commits it with the child.
  optional omloom.v1.AssetRef parent = 5;
}
message Create {
  // User-selected kind of the new inventory resource, not an external provisioning request.
  omloom.v1.AssetKind kind = 1;
  // Explicit initial accepted fields, validated using the ordinary write contract.
  repeated omloom.v1.Field changes = 2;
  // Actual existing parent selected in the current working context, if known.
  optional omloom.v1.AssetRef parent = 3;
  // At most 16 initial address facts, committed with the new device, VM or installation.
  repeated InitialAddress addresses = 4;
}
message Bulk {
  // Explicit bounded target identities reviewed by the user.
  repeated omloom.v1.AssetRef targets = 1;
  // Application revision used to resolve that exact selection.
  uint64 expected = 2;
  // Set/clear changes; omitted fields are preserved for every target.
  repeated omloom.v1.Field changes = 3;
  // Explicit removal request, incompatible with field changes.
  bool remove = 4;
}
message Definition {
  // Server-generated local definition UUID, stable across rename and migration.
  string id = 1;
  // User-visible name; equal labels do not make two definitions equivalent.
  string name = 2;
  // User-written bounded field help, independently protected as schema metadata.
  string description = 3;
  // User-selected type; date and choice retain explicit definition meaning.
  FieldType type = 4;
  // Explicit applicable asset kinds, not inferred from imported values.
  repeated omloom.v1.AssetKind kinds = 5;
  // Explicit allowed values for choice fields, empty for other field types.
  repeated string choices = 6;
  // Explicit selection for descriptive search; false never creates an index.
  bool searchable = 7;
  // Server revision, echoed as a precondition for edits and retirement.
  uint64 revision = 8;
  // Explicit retirement request; current values keep their original interpretation.
  bool retired = 9;
  // Server-owned interpretation generation, starting at one. Responses supply
  // it for predicates; inputs omit it because the server derives it under revision CAS.
  uint64 generation = 10;
}
message Conversion {
  // Current typed value selected in the migration preview.
  omloom.v1.Field from = 1;
  // Reviewed replacement, including explicit clear when chosen by the user.
  omloom.v1.Field to = 2;
}
message Migration {
  // Reviewed next definition, carrying the expected current definition revision.
  Definition definition = 1;
  // Explicit complete conversion rules; missing conversions cannot use defaults.
  repeated Conversion conversions = 2;
  // Application revision shown in the migration preview, checked before activation.
  uint64 expected = 3;
  // True applies the reviewed migration; false returns its actual affected scope.
  bool apply = 4;
  // Explicit consent to deterministic text/integer/boolean/date conversions;
  // invalid conversions still reject the entire reviewed migration.
  bool convert_types = 5;
  // Explicit consent to remove accepted local values from kinds excluded by
  // the next applicability set. Source observations and proposals are untouched.
  bool remove_inapplicable = 6;
}
message MigrationIssue {
  // Server-selected authorized resource with an invalid current value.
  omloom.v1.AssetRef target = 1;
  // Current accepted value requiring repair or an explicit conversion rule.
  omloom.v1.Field value = 2;
  // Actionable validation explanation, without provider payloads or secrets.
  string diagnostic = 3;
}
message MigrationPreview {
  // Application revision read atomically for this non-persistent preview.
  uint64 revision = 1;
  // Total accepted values checked, including explicit applicability removals.
  uint64 affected = 2;
  // Accepted values that would be removed under the explicit requested policy.
  uint64 removed = 3;
  // Total invalid values. A nonzero count prevents the entire migration.
  uint64 invalid = 4;
  // At most 32 authorized examples; invalid reports total coverage separately.
  repeated MigrationIssue issues = 5;
}
message SavedView {
  // Server-generated stable view UUID; empty means create a new personal view.
  string id = 1;
  // User-visible name; private metadata is protected separately from asset data.
  string name = 2;
  // User-selected bounded query/layout, never a stored result set or executable code.
  Query query = 3;
  // Server edit revision, echoed for conditional saves.
  uint64 revision = 4;
  // Server-derived opaque definition owner, not an actor assertion in a request.
  string owner = 5;
  // Explicit team audiences; empty preserves personal-only visibility.
  repeated string audiences = 6;
  // Explicit team editors, constrained to the publication audience.
  repeated string editors = 7;
}
message SaveView {
  // Definition the user edited; server ignores/rejects caller-supplied owner changes.
  SavedView view = 1;
  // True commits the separately reviewed publication; false previews disclosure.
  bool publish = 2;
  // Explicit owner-authorized removal of the named definition at its revision.
  bool remove = 3;
}
message Mapping {
  // Exact source CSV column name selected by the user.
  string source = 1;
  // Explicit destination built-in name or company definition UUID.
  string field = 2;
}
message Import {
  // User-provided UTF-8 CSV, bounded before parsing; never retained as raw history.
  string csv = 1;
  // Explicit source-to-destination mapping; no automatic schema installation.
  repeated Mapping mappings = 2;
  // Kind selected for new rows; update rows retain their existing kind.
  omloom.v1.AssetKind kind = 3;
  // Explicit preview UUID to apply; absent means prepare a preview from CSV.
  optional string preview = 4;
  // Explicit source name within the current actor's import configuration;
  // new source objects require an external_id CSV column for repeat-safe mapping.
  string source = 5;
  // Explicit parent selected for new imported rows; updates retain their
  // existing attachment. Preview and acceptance check the same working context.
  optional omloom.v1.AssetRef parent = 6;
}

// One-shot source evidence. Keys identify findings within this source, not
// accepted inventory, people or authority. Unknown intermediaries stay absent.
message HostReport {
  // Collector format version. Readers reject unsupported mandatory semantics.
  uint32 version = 1;
  // Actual native platform: macos, linux or windows.
  string platform = 2;
  // Source installation evidence, not authenticated machine identity or a grant.
  string source_basis = 3;
  // Actual boot/session evidence, checked again before committing the output file.
  string boot_basis = 4;
  // Source collection instant, Unix milliseconds, never receiver-generated freshness.
  uint64 observed_at = 5;
  // Selected candidate components, in parent-before-child order, at most 128.
  repeated HostFinding findings = 6;
  // Each attempted module's actual coverage. Missing modules are not complete.
  repeated CollectionCoverage coverage = 7;
  // Local host routes and readable policy; installation and service IDs are
  // assigned only after explicit review. Socket owners use binds below.
  HostNetwork network = 8;
  // Observed service binds with source-local owner references, never Port assets.
  repeated HostBind binds = 9;
}
message HostFinding {
  // Source-scoped candidate key, at most 256 bytes. Names/IPs alone do not
  // establish continuity; process findings include the actual boot/PID basis.
  string key = 1;
  // Known candidate kind. UNSPECIFIED is allowed only for root key "hardware":
  // executing on an OS does not prove a physical Device rather than a VM.
  // Review supplies its type or explicitly matches an existing execution host.
  omloom.v1.AssetKind kind = 2;
  // Actual known parent candidate key; absence means no proven intermediary.
  optional string parent = 3;
  // Selected current facts only, without environment, commands or package lists.
  // An unclassified execution host supplies initialization proposals only;
  // matching an existing host preserves its accepted name and other fields.
  repeated omloom.v1.Field fields = 4;
  // Current non-temporary interface addresses, never canonical IPAM allocations.
  repeated CurrentAddress addresses = 5;
  // Whether this source/interface address selection completed successfully.
  bool addresses_complete = 6;
  // Known container runtime candidate, independent of deployment ownership.
  optional string runtime = 7;
  // Selected layer-specific source claims, at most four. Missing evidence stays
  // unknown. Claims support reviewed comparison, never authentication or grants.
  repeated HostIdentityClaim identity = 8;
}
// What a source identifier describes. Boot sessions stay in HostReport.boot_basis
// and never become permanent host or OS identities.
enum HostIdentityKind {
  HOST_IDENTITY_KIND_UNSPECIFIED = 0;
  HOST_IDENTITY_KIND_HARDWARE_UUID = 1;
  HOST_IDENTITY_KIND_INSTALLATION_ID = 2;
  HOST_IDENTITY_KIND_INTERFACE_ID = 3;
  HOST_IDENTITY_KIND_FACTORY_MAC = 4;
}
// Evidence limitations are independent of equality. Even a reported hardware
// UUID can be cloned or forged and cannot authorize a connection or correction.
enum HostIdentityQuality {
  HOST_IDENTITY_QUALITY_UNSPECIFIED = 0;
  HOST_IDENTITY_QUALITY_REPORTED = 1;
  HOST_IDENTITY_QUALITY_MOVABLE = 2;
  HOST_IDENTITY_QUALITY_UNRELIABLE = 3;
}
message HostIdentityClaim {
  // Collector-selected subject layer and identifier meaning.
  HostIdentityKind kind = 1;
  // Actual identifier namespace, at most 80 UTF-8 bytes. Equal digests in
  // different namespaces are not matching evidence.
  string namespace = 2;
  // Collector SHA-256 of the normalized identifier, 64 lowercase hex digits.
  // This minimizes retained raw identifiers but is not a confidentiality claim.
  string digest = 3;
  // Actual source limitation. Unspecified quality is invalid, not trusted.
  HostIdentityQuality quality = 4;
}
message HostIdentityObservation {
  // Original source claim, including namespace and known limitations.
  HostIdentityClaim claim = 1;
  // Reviewed import configuration name, not the actor or a trusted issuer.
  string source = 2;
  // Actual claim collection instant, Unix milliseconds. A report omitting this
  // claim cannot freshen it by merely updating the source checkpoint.
  uint64 observed_at = 3;
  // Boot/session basis of that collection. It is evidence, not an OS asset ID.
  string boot_basis = 4;
}
message CompareHostIdentity {
  // First explicitly selected accepted resource incarnation, never a name/IP.
  omloom.v1.AssetRef left = 1;
  // Second explicitly selected accepted resource incarnation in the same
  // authorized working context. Comparison itself changes no identity.
  omloom.v1.AssetRef right = 2;
  // Explicit expansion of bounded affected relation metadata for correction planning.
  bool include_relations = 3;
}
message HostIdentitySubject {
  // Current accepted fields that the caller may read, without descendants,
  // routes, firewall configuration or implied rights to those resources.
  Item item = 1;
  // Current permitted source claims with their original evidence windows.
  repeated HostIdentityObservation identity = 2;
  // Permitted current source labels; no source payloads or hidden counts.
  repeated string sources = 3;
  // Selected relation metadata, only when explicitly requested and both ends visible.
  repeated omloom.v1.Relation relations = 4;
  // Permitted immutable domain facts used to assess duplicate compatibility.
  // These explain Prefix CIDR/namespace; they are not selectable field copies.
  repeated omloom.v1.Field domain_fields = 5;
  // Current permitted names for the references in domain_fields, keyed by the
  // corresponding field name. Values are text from the same comparison snapshot.
  // A missing label does not hide the reference or grant access to its target.
  repeated omloom.v1.Field domain_labels = 6;
}
message HostIdentityComparison {
  // Server-selected consistent application revision for both subjects.
  uint64 revision = 1;
  // Authorized first resource and selected identity evidence.
  HostIdentitySubject left = 2;
  // Authorized second resource and selected identity evidence.
  HostIdentitySubject right = 3;
}
message FindIdentityCandidates {
  // Selected current subject whose permitted claims supply exact indexed probes.
  omloom.v1.AssetRef target = 1;
  // Source claims supplied for explicit pre-adoption lookup, at most four.
  // Mutually exclusive with target; matching never adopts or authenticates a host.
  repeated HostIdentityClaim claims = 2;
  // User-reviewed subject layer for claims-only lookup; absent when target is set.
  omloom.v1.AssetKind kind = 3;
}
message IdentityCandidates {
  // Bounded visible same-layer subjects; a match is evidence, never a merge.
  repeated Item items = 1;
}
message ResolveIdentity {
  // Original retired local reference. Resolution is read-only, never an effect target.
  omloom.v1.AssetRef original = 1;
}
message ResolvedIdentity {
  // Original reference retained for provenance in the UI.
  omloom.v1.AssetRef original = 1;
  // Current canonical resource with current rights applied independently.
  Item canonical = 2;
}
enum IdentityDecision {
  IDENTITY_DECISION_UNSPECIFIED = 0;
  IDENTITY_DECISION_KEEP_SEPARATE = 1;
  IDENTITY_DECISION_DISTINCT_INSTALLATIONS = 2;
  IDENTITY_DECISION_DUPLICATE_INSTALLATION = 3;
  // Explicit duplicate Prefix conclusion; CIDR equality alone supplies no decision.
  IDENTITY_DECISION_DUPLICATE_RESOURCE = 4;
}
message IdentityFieldChoice {
  // Exact accepted field being resolved on the selected duplicate.
  string name = 1;
  // Explicit choice to use the duplicate's value instead of the retained value.
  bool use_duplicate = 2;
}
message IdentitySourceChoice {
  // Existing label group on this duplicate, shown by the server. A rename
  // applies to all bindings with this label, without combining their data.
  string before = 1;
  // Reviewed display label after relocation; native binding identity is unchanged.
  string after = 2;
}
message IdentityMapping {
  // Explicitly selected duplicate incarnation to retire, never inferred from IP.
  omloom.v1.AssetRef duplicate = 1;
  // Existing canonical incarnation to retain at the same subject layer.
  omloom.v1.AssetRef retained = 2;
  // Explicit decisions for every field on the retiring identity, at most 32.
  repeated IdentityFieldChoice fields = 3;
  // Optional label changes, at most eight. Unbound source name collisions are refused;
  // native sources retain independent bindings even when labels are identical.
  repeated IdentitySourceChoice sources = 4;
  // Individually confirmed physical attachment relation UUIDs, at most 128.
  repeated string attachments = 5;
}
message IdentityCorrection {
  // Operator conclusion; equality of identifiers never supplies this decision.
  IdentityDecision decision = 1;
  // Selected layer mappings, at most eight; never an instruction to merge descendants.
  repeated IdentityMapping mappings = 2;
  // Exact bounded preview to accept; mappings/decision must be absent on apply.
  optional string preview = 3;
  // Exact accepted correction to reverse within its window, after fresh checks.
  optional string undo = 4;
}
message IdentityImpact {
  // Existing relation before the proposed correction.
  omloom.v1.Relation before = 1;
  // Proposed relation; absent means an explicitly redundant/self attachment is removed.
  optional omloom.v1.Relation after = 2;
}
message IdentityCorrectionView {
  // Server-owned review identifier; no mutation has yet been accepted.
  string id = 1;
  // Installation revision fencing the complete reviewed change.
  uint64 revision = 2;
  // Selected explicit mappings, preserving the operator's field/source decisions.
  repeated IdentityMapping mappings = 3;
  // Bounded affected relations only, without loading descendant payloads.
  repeated IdentityImpact relations = 4;
  // Server-declared expiry of this preview in Unix milliseconds.
  uint64 expires_at = 5;
}
message IdentityCorrectionApplied {
  // Actual application revision after this correction or its explicit inverse.
  uint64 revision = 1;
  // Server-owned correction identifier for the bounded inverse window.
  string id = 2;
  // Expiry of the inverse window in Unix milliseconds; zero after reversal.
  uint64 undo_until = 3;
  // Canonical identities affected by the accepted operator decision.
  repeated omloom.v1.AssetRef retained = 4;
}
message HostBind {
  // Source-local service candidate owning this observed bind. Empty means the
  // kernel bind was seen without a qualified owner; it cannot adopt a service.
  string owner = 1;
  // Kernel bind evidence; accepted service identity is intentionally absent.
  SocketBind value = 2;
}
message CollectionCoverage {
  // Collector-owned module name, never a permission or provider capability grant.
  string module = 1;
  // Actual result: verified, partial, failed, blocked or unavailable.
  string status = 2;
  // Bounded non-secret explanation of collection scope or missing evidence.
  string detail = 3;
}
message HostSelection {
  // Explicitly selected source-local candidate key.
  string key = 1;
  // Operator-selected existing identity; absence permits new reviewed adoption.
  // Equal name/IP never supplies this field automatically.
  optional omloom.v1.AssetRef target = 2;
  // User-known Device or VirtualMachine type for a new unclassified execution
  // host. Omit for a known source kind or when matching an existing identity,
  // whose type is derived by the server. A reviewed mapping cannot be retyped.
  optional omloom.v1.AssetKind kind = 3;
}
message HostImport {
  // Native report being reviewed; absent when accepting the prepared preview.
  HostReport report = 1;
  // Explicit source configuration name within the caller's import namespace,
  // at most 80 UTF-8 bytes. Network sections have independent named projections.
  string source = 2;
  // Selected candidates and explicit existing matches. Unselected findings
  // are not persisted. Required unknown parents must be resolved by the user.
  repeated HostSelection selection = 3;
  // Exact server-generated preview being accepted; no report is resent on apply.
  optional string preview = 4;
  // Explicitly selected network sections of the selected installation. Empty
  // means none; unselected routes/rules/binds never enter preview custody.
  repeated HostNetworkPart network_parts = 5;
}
enum HostNetworkPart {
  HOST_NETWORK_PART_UNSPECIFIED = 0;
  HOST_NETWORK_PART_SOCKETS = 1;
  HOST_NETWORK_PART_ROUTES = 2;
  HOST_NETWORK_PART_APPLICATION_FIREWALL = 3;
}

enum AddressMeaning {
  ADDRESS_MEANING_UNSPECIFIED = 0;
  ADDRESS_MEANING_CONFIGURED = 1;
  ADDRESS_MEANING_DESTINATION = 2;
}
message Address {
  // Existing known-address reference for conditional editing, absent to record
  // a new fact. Equal IP bytes never identify an existing reference implicitly.
  optional omloom.v1.AssetRef target = 1;
  // Revision read for this reference, required for edits and absent on creation.
  optional uint64 expected = 2;
  // User-known IPv4/IPv6 literal or IP/CIDR, optionally followed by `brd IPv4`,
  // at most 192 UTF-8 bytes, without an invented mask or forwarding context.
  // Required on creation; omission preserves it on edit without echoing a
  // field the caller may not read. A scoped literal uses the zone field.
  optional string address = 3;
  // Known assignment prefix length. Absent means unknown on creation and
  // preserves the current value on edit; zero is a real /0.
  optional uint32 prefix_length = 4;
  // User-selected meaning; configured and destination facts cannot substitute
  // for one another or prove current reachability or allocation authority.
  // Absence means unspecified on creation and preserves the meaning on edit.
  optional AddressMeaning meaning = 5;
  // Known host-local IPv6 zone label, preserved when omitted on edit.
  // It is not a portable routing/L2 identity.
  optional string zone = 6;
  // Actual parent/subject for a new fact, absent for standalone inventory.
  // No device or interface is invented when the source did not supply one.
  optional omloom.v1.AssetRef parent = 7;
  // Explicit canonical IPAM identity selected in a reviewed broader context.
  // Omission preserves a binding; clearing is an explicit separate edit.
  optional omloom.v1.AssetRef binding = 8;
  // Explicit removal of a prior binding, incompatible with a new binding.
  bool clear_binding = 9;
  // Explicitly make the assignment mask unknown; incompatible with prefix_length.
  bool clear_prefix_length = 10;
  // Explicitly remove the known host-local zone; incompatible with zone.
  bool clear_zone = 11;
  // Explicit optional description/company-field changes. Omitted fields remain
  // untouched; name is derived from the known address and cannot be supplied.
  repeated omloom.v1.Field changes = 12;
  // Explicit reviewed new canonical allocation, mutually exclusive with binding.
  // Its namespace, uniqueness and optional assignment commit with this mapping.
  optional Network allocation = 13;
  // Explicit intended assignment to an existing permitted interface. Omitted
  // means bind knowledge only, never infer an assignment from an address fact.
  optional omloom.v1.AssetRef interface = 14;
  // Intended participant priority for an explicitly selected VRRP assignment.
  // This is not observed election state and is absent for ordinary assignment.
  optional uint32 priority = 15;
  // User-selected existing Prefix knowledge, independently of canonical binding.
  // Omission preserves a prior relationship; clear_prefix explicitly removes it.
  optional omloom.v1.AssetRef prefix = 16;
  // User requests a new unresolved Prefix from the supplied assignment mask.
  // The server derives CIDR and commits the prefix and fact together. Exclusive
  // with prefix and clear_prefix; this never allocates an address.
  bool create_prefix = 17;
  // Optional user label for create_prefix, at most 160 UTF-8 bytes. An omitted
  // label is derived for presentation, not stored as another source of truth.
  optional string prefix_name = 18;
  // User/source-supplied IPv4 endpoint broadcast, not a prefix allocation bound.
  // IPv6 and incompatible prefix lengths reject this assertion.
  optional string broadcast = 19;
  // Explicit removal of the selected Prefix knowledge relationship.
  bool clear_prefix = 20;
  // Explicit removal of the broadcast claim; incompatible with broadcast.
  bool clear_broadcast = 21;
}
message AddressAttributeChange {
  // Previously accepted current value from this exact interface/source.
  CurrentAddress before = 1;
  // Selected incoming value for the same address, without rewriting a service bind.
  CurrentAddress after = 2;
}
message AddressReview {
  // Current installation revision used by the complete transient validation.
  uint64 revision = 1;
  // Server-normalized address, only when that field is currently readable.
  optional string address = 2;
  // Accepted assignment mask when supplied/known and readable; absent is unknown.
  optional uint32 prefix_length = 3;
  // Known host-local zone when readable; never an allocation namespace.
  optional string zone = 4;
  // Explicit endpoint broadcast when readable, separate from calculated broadcast.
  optional string broadcast = 5;
  // Canonical CIDR of the explicitly selected or newly proposed Prefix.
  optional string prefix_cidr = 6;
}
message AddressDelta {
  // Selected import configuration whose current facts are being compared.
  string source = 1;
  // Incoming addresses absent from this source's current interface observations.
  repeated CurrentAddress added = 2;
  // Current addresses omitted by an explicitly complete source refresh only.
  repeated CurrentAddress removed = 3;
  // Attribute changes on retained addresses; no duplicate unchanged values.
  repeated AddressAttributeChange updated = 4;
  // Source-declared completeness; false means omissions are retained.
  bool complete = 5;
}
message ImportRow {
  // One-based source row used to locate errors without losing input context.
  uint32 row = 1;
  // Proposed explicit mutation, absent when validation failed.
  Write change = 2;
  // Field-specific actionable validation diagnostic; never a successful error envelope.
  string diagnostic = 3;
  // Authorized source-local address differences derived for this bounded review.
  // Absent for non-interface rows or when current-address reading is not allowed.
  AddressDelta addresses = 4;
}
message Preview {
  // Server-generated bounded-lived preview identity, absent for invalid previews.
  optional string id = 1;
  // Selected row changes and validation diagnostics for operator review.
  repeated ImportRow rows = 2;
  // Source/application revision bound to this reviewed preview.
  uint64 revision = 3;
}
message Network {
  // Existing IP/prefix/VLAN/routing resource identity, absent for creation.
  optional omloom.v1.AssetRef target = 1;
  // Current accepted revision required for mutation of an existing resource.
  optional uint64 expected = 2;
  // User-selected IP address or prefix kind; no implicit address-space creation.
  omloom.v1.AssetKind kind = 3;
  // Explicit allocation namespace with stable local identity.
  omloom.v1.AssetRef address_space = 4;
  // User input address/mask, canonicalized by the server, with host mask retained.
  string cidr = 5;
  // Explicit L2/link scope for link-local addresses and gateway protocol context.
  optional omloom.v1.AssetRef link = 6;
  // Explicit routing context, independent of address-space identity.
  optional omloom.v1.AssetRef routing = 7;
  // User-reviewed allocation mechanism, required explicitly for ungrouped creation
  // or conversion. Omitted/unspecified cannot implicitly select exclusive use.
  SharedUse sharing = 8;
  // Protocol VRID for VRRP, scoped to L2 domain and IP family, not a global identity.
  optional uint32 vrid = 9;
  // Explicit ordinary inventory name, not proof of observed network health.
  // Optional for Prefix: empty preserves an existing label or creates an unnamed
  // prefix. Clear an existing label explicitly with clear_name or a Write clear.
  string name = 10;
  // Select an unused address within this prefix atomically; no IPv6 enumeration.
  bool next_available = 11;
  // Explicit 802.1Q VLAN identifier (1-4094), meaningful only with a selected L2 domain.
  optional uint32 vlan_id = 12;
  // Explicit existing shared group selected by the user. Its mechanism and VRRP
  // parameters are server-owned: omit group_name, link/vrid (for VRRP) and use
  // SHARED_USE_UNSPECIFIED when selecting it. Interface rights are not inherited.
  optional omloom.v1.AssetRef group = 13;
  // User-chosen name of a new VRRP/anycast group. Required only when creating
  // that group, never a label-based lookup or automatic merge with an existing one.
  string group_name = 14;
  // Reviewed revision of the selected existing group, omitted for a new group.
  optional uint64 expected_group = 15;
  // Reviewed revision of the address's previous group when leaving it. Separate
  // from the selected group's revision because these are independent objects.
  optional uint64 previous_group_revision = 16;
  // Selected allocation container for creation. The server derives its real
  // namespace/link and checks prefix containment without inheriting grants.
  // Required for scoped creation; omitted when editing an existing allocation.
  optional omloom.v1.AssetRef parent = 17;
  // User-requested removal of a Prefix label, committed with its network settings.
  // False leaves the name semantics above unchanged. Cannot accompany a nonempty
  // name or another resource kind; the server checks the name write permission.
  bool clear_name = 18;
}
message Member {
  // Canonical address or typed address-group identity selected for this edit.
  // Memberships never duplicate an address or create a second participant list.
  omloom.v1.AssetRef address = 1;
  // User-selected participant interface identity, rechecked against actual kind/scope.
  omloom.v1.AssetRef interface = 2;
  // Address revision reviewed before membership change.
  uint64 expected = 3;
  // Explicit removal of only this participant, not a release of the shared address.
  bool remove = 4;
  // VRRP intended priority; no priority is interpreted as observed active status.
  optional uint32 priority = 5;
  // Current group revision reviewed via an address. Required for a shared
  // address, omitted for exclusive assignment or a direct group edit.
  optional uint64 expected_group = 6;
}
message Export {
  // Explicit currently permitted query and requested columns to export.
  Query query = 1;
  // True selects spreadsheet-safe CSV; false requests lossless machine CSV.
  bool spreadsheet = 2;
}
message Download {
  // Server-produced bounded UTF-8 CSV from authorized current projections.
  string csv = 1;
  // Exact application revision of the exported result.
  uint64 revision = 2;
}
message Identity {
  // Name of the server-configured synthetic actor; this is not a login identity.
  string name = 1;
  // Named fixture used by this explicit development host.
  string fixture = 2;
  // Server-selected team references used by saved-view fixture scenarios.
  repeated string teams = 3;
  // Whether this context may edit permitted inventory; not inferred from UI controls.
  bool writable = 4;
  // Whether this context may administer company field definitions.
  bool schema_admin = 5;
}
message Definitions {
  // Only definition metadata permitted to this server-selected context.
  repeated Definition items = 1;
}
message Views {
  // Only personally owned or explicitly published definition metadata.
  repeated SavedView items = 1;
}
message Mutation {
  // Actual resulting application revision, including no-op detection.
  uint64 revision = 1;
  // Identities actually affected, never silently expanded from a changed query.
  repeated omloom.v1.AssetRef targets = 2;
  // Number of current values affected by a reviewed schema migration.
  uint64 affected = 3;
}
message Empty {}
enum RequirementComparison {
  REQUIREMENT_COMPARISON_UNSPECIFIED = 0;
  REQUIREMENT_COMPARISON_EQUAL = 1;
  REQUIREMENT_COMPARISON_MINIMUM = 2;
  REQUIREMENT_COMPARISON_MAXIMUM = 3;
}
enum RequirementLayer {
  REQUIREMENT_LAYER_UNSPECIFIED = 0;
  REQUIREMENT_LAYER_ACCEPTED = 1;
  REQUIREMENT_LAYER_OBSERVED = 2;
}
enum RequirementGroupKind {
  REQUIREMENT_GROUP_KIND_UNSPECIFIED = 0;
  REQUIREMENT_GROUP_KIND_ALL = 1;
  REQUIREMENT_GROUP_KIND_ANY = 2;
  REQUIREMENT_GROUP_KIND_AT_LEAST = 3;
}
message FieldRequirement {
  // Caller-selected exact resource whose recorded fact is needed, not a grant.
  omloom.v1.AssetRef target = 1;
  // User's desired value and field name; clear and hypotheses are not expectations.
  // Numeric measurements require equal lower/upper bounds and an explicit unit.
  omloom.v1.Field expected = 2;
  // Typed comparison selected by the caller, never executable expression text.
  RequirementComparison comparison = 3;
  // Whether to inspect accepted configuration or actual dated source claims.
  // Accepted configuration never certifies observed availability.
  RequirementLayer layer = 4;
}
message RequirementGroup {
  // User-selected logical combination. This query does not certify consensus.
  RequirementGroupKind kind = 1;
  // Indices into EvaluateRequirements.nodes, at most 64 references per group.
  repeated uint32 members = 2;
  // Required only for AT_LEAST; count distinct scoped subjects, not source rows.
  // Direct field subjects can vote; nested logical groups have unknown voter identity.
  uint32 minimum = 3;
}
message PowerPathRequirement {
  // Caller-selected input sources/ports whose accepted dependency paths must be
  // disjoint, from 2 to 8 references. Repeated identity proves a shared source.
  repeated omloom.v1.AssetRef sources = 1;
  // Caller-selected terminal boundaries, at most 8 references. Every recorded
  // path must reach one to qualify a pass; a boundary cannot hide known upstream
  // dependencies. Omission allows counterexamples, never a positive result.
  // Completeness and authority come from current server records, not this list.
  repeated omloom.v1.AssetRef boundaries = 2;
}
message RequirementNode {
  // One bounded predicate or group. Groups are a flat indexed graph, not recursive wire messages.
  oneof expression {
    FieldRequirement field = 1;
    RequirementGroup group = 2;
    // Accepted dependency-path disjointness within explicit boundaries. This
    // does not certify live power, surviving capacity or electrical safety.
    PowerPathRequirement power_paths = 3;
    // Exact accepted binding basis. Combines with other predicates in the
    // shared graph; it never certifies observed signal or service availability.
    BindingRequirement binding = 4;
  }
}
message BindingRequirement {
  // User-selected relation UUID and revision from an authorized current read.
  string relation_id = 1;
  // Exact reviewed positive revision. A removed/recreated edge cannot satisfy it.
  uint64 revision = 2;
  // Both reviewed endpoints, required to check rights even if the edge is absent.
  omloom.v1.AssetRef from = 3;
  // Reviewed destination incarnation, never inferred from a label or position.
  omloom.v1.AssetRef to = 4;
  // Reviewed relationship meaning. A matching UUID cannot change its meaning.
  omloom.v1.RelationKind kind = 5;
}
message EvaluateRequirements {
  // Resource whose selected requirements are being inspected in the working context.
  omloom.v1.AssetRef anchor = 1;
  // Caller-supplied desired conditions, at most 64 nodes and 256 total edges.
  // Actual evidence, authority and completeness are always loaded by the server.
  repeated RequirementNode nodes = 2;
  // Selected method/root index. Unselected alternatives do not affect this result.
  uint32 root = 3;
}
enum RequirementState {
  REQUIREMENT_STATE_UNSPECIFIED = 0;
  REQUIREMENT_STATE_SATISFIED = 1;
  REQUIREMENT_STATE_FAILED = 2;
  REQUIREMENT_STATE_UNKNOWN = 3;
}
enum RequirementReason {
  REQUIREMENT_REASON_UNSPECIFIED = 0;
  REQUIREMENT_REASON_MATCH = 1;
  REQUIREMENT_REASON_MISMATCH = 2;
  REQUIREMENT_REASON_MISSING = 3;
  REQUIREMENT_REASON_STALE = 4;
  REQUIREMENT_REASON_CONFLICT = 5;
  REQUIREMENT_REASON_RESTRICTED = 6;
  REQUIREMENT_REASON_UNSUPPORTED = 7;
  REQUIREMENT_REASON_UNCONFIGURED = 8;
  REQUIREMENT_REASON_AUTHORITY_UNAVAILABLE = 9;
  REQUIREMENT_REASON_OWNER_ACTION_REQUIRED = 10;
  REQUIREMENT_REASON_INCOMPLETE = 11;
  REQUIREMENT_REASON_SCOPE_MISMATCH = 12;
  REQUIREMENT_REASON_VANTAGE_MISMATCH = 13;
  REQUIREMENT_REASON_UNQUALIFIED = 14;
  REQUIREMENT_REASON_WRONG_EVIDENCE = 15;
  REQUIREMENT_REASON_CYCLE = 16;
}
enum RequirementResolution {
  REQUIREMENT_RESOLUTION_UNSPECIFIED = 0;
  REQUIREMENT_RESOLUTION_RECORD_FACT = 1;
  REQUIREMENT_RESOLUTION_REVIEW_SOURCE = 2;
  REQUIREMENT_RESOLUTION_OWNER_ACTION = 3;
}
message RequirementEvidence {
  // Permitted source or authority reference, never a credential or release token.
  string source = 1;
  // Source/content revision; absent means it was not supplied by that source.
  optional string revision = 2;
  // Original observation time in Unix milliseconds, absent for accepted intent.
  optional uint64 observed_at_ms = 3;
  // Original expiry in Unix milliseconds, absent for current accepted intent.
  optional uint64 valid_until_ms = 4;
  // Original source scan identity when no comparable source revision is supplied.
  optional string scan_id = 5;
}
message RequirementResult {
  // Original requested node index; no hidden dependency identities are added.
  uint32 node = 1;
  // Server-derived semantic key over the condition and scoped subject, independent of current values.
  string semantic_key = 2;
  // Predicate evidence result, never an authorization decision or effect receipt.
  RequirementState state = 3;
  // Stable reason; protected/missing subjects have the same restricted response.
  RequirementReason reason = 4;
  // Disclosed subject only when current object and requested field rights allow it.
  optional omloom.v1.AssetRef target = 5;
  // Disclosed field name; absent for groups and restricted requirements.
  optional string field = 6;
  // Only currently permitted next steps; reading never submits a request.
  repeated RequirementResolution resolutions = 7;
  // At most 32 permitted current source bases, without raw source payloads.
  repeated RequirementEvidence evidence = 8;
}
message RequirementEvaluation {
  // Current consistent inventory basis. Evaluations are transient and are not saved.
  uint64 revision = 1;
  // Observation of time for evaluating the supplied validity windows, Unix milliseconds.
  uint64 evaluated_at_ms = 2;
  // Overall selected-condition result, never safe-to-execute or an authority grant.
  RequirementState state = 3;
  // Overall reason; a cycle cannot become a partially successful graph.
  RequirementReason reason = 4;
  // Only nodes reached from the selected root; no facts for unselected methods.
  repeated RequirementResult results = 5;
}

// Half-open physical extent in integer micrometres in its owner's coordinates.
message PhysicalExtent {
  // User-supplied signed origin, allowing documented external service clearance.
  sint64 start_um = 1;
  // Positive physical length; zero is invalid, not an unknown measurement.
  uint64 length_um = 2;
}
message PhysicalVolume {
  // Horizontal extent in the owning enclosure's coordinate system.
  PhysicalExtent x = 1;
  // Vertical extent; one rack unit is exactly 44450 micrometres.
  PhysicalExtent y = 2;
  // Front-to-rear extent; opposite faces share the same coordinates.
  PhysicalExtent z = 3;
}
// Current explicit private/unmatched physical facts, not a second model catalogue.
message PhysicalDefinition {
  // Existing resource incarnation whose current physical facts are being refined.
  omloom.v1.AssetRef target = 1;
  // Usable enclosure volume, absent if unknown. Device/component dimensions
  // belong to their canonical width/height/depth equipment claims instead.
  optional PhysicalVolume volume = 2;
  // Source/instruction reference supplied by the operator, max 512 bytes; no secrets.
  string basis = 3;
  reserved 4;
  // Optional permitted supported mass in grams, independently of actual equipment mass.
  optional uint64 max_mass_g = 5;
  // Optional design power requirement in milliwatts, not a measured load.
  optional uint64 demand_mw = 6;
  // Optional design power budget in milliwatts, not proof of independent feeds.
  optional uint64 capacity_mw = 7;
  // Optional design cooling demand in milliwatts, independent of power measurements.
  optional uint64 cooling_mw = 8;
  // Optional qualified cooling capacity in milliwatts; missing is unknown.
  optional uint64 cooling_capacity_mw = 9;
  // Explicit rail/attachment standard, max 128 bytes; missing means unqualified fit.
  optional string mounting = 10;
  // Sourced device/component class; unspecified preserves unknown classification.
  // Structural position classes belong to PhysicalPositionEdit, not this profile.
  // Labels, serials and position alone never establish the part's identity/class.
  PhysicalComponentKind component_kind = 11;
  // Optional operator/source-declared mating contract for this actual connector.
  // It proves only the named mechanical interface, not signal/power/service health.
  optional PhysicalMating mating = 12;
  // Optional operator/source-declared equipment service/connector margins in
  // its enclosing coordinate frame. Missing is unqualified, not measured zero.
  // Admission checks declared margins without saving expanded occupancy copies.
  optional PhysicalClearance clearance = 13;
  // Operator/source-asserted region whose current actual occupancy is completely
  // represented, in this enclosure's coordinate frame. Missing is unqualified,
  // never empty. A broader usable envelope does not extend this evidence.
  // This grants no access and reserves no space; its source is the basis above.
  optional PhysicalVolume occupancy_coverage = 14;
  // Operator/source assertion that all current upstream PoweredBy dependencies
  // of this resource are recorded. False/absent is unqualified, not an empty
  // supply list. The basis above attributes this assertion. It grants no rights
  // and does not assert live power or independence beyond the selected boundary.
  bool power_sources_complete = 15;
  // Optional sourced rack rail grid, independent of cabinet dimensions or occupancy.
  // Missing permits coordinate-based drafts but supplies no rack unit numbering.
  optional PhysicalRackGrid rack_grid = 16;
  // Sourced assembly construction, only on a Cable. DAC/AOC end modules belong
  // to this one cable identity; no independently replaceable optics are implied.
  PhysicalAssemblyKind assembly_kind = 17;
  // Explicit sourced channel numbers supplied by this physical Port, at most
  // 64 distinct values from 1 to 4096. Missing is unknown, never all lanes.
  repeated uint32 channels = 18;
}
message PhysicalChannelSet {
  // Bounded canonical channel set consumed as one physical definition.
  repeated uint32 channels = 1;
}
enum PhysicalAssemblyKind {
  PHYSICAL_ASSEMBLY_KIND_UNSPECIFIED = 0;
  PHYSICAL_ASSEMBLY_KIND_PASSIVE = 1;
  PHYSICAL_ASSEMBLY_KIND_DAC = 2;
  PHYSICAL_ASSEMBLY_KIND_AOC = 3;
}
message PhysicalRackGrid {
  // User/source-measured top of the rail grid in enclosure Y micrometres.
  // Increasing Y runs downward for this rack frame; this is not the cabinet height.
  sint64 top_um = 1;
  // User/source-declared positive number of rack units; each is exactly 44450 um.
  uint32 unit_count = 2;
  // User/source-declared lowest printed unit number, positive. Together with count
  // it must fit uint32. Labels do not create inventory objects for every unit.
  uint32 first_unit = 3;
  // User/source-declared numbering direction. UNSPECIFIED is invalid when present.
  PhysicalRackDirection direction = 4;
}
enum PhysicalRackDirection {
  PHYSICAL_RACK_DIRECTION_UNSPECIFIED = 0;
  PHYSICAL_RACK_DIRECTION_TOP_DOWN = 1;
  PHYSICAL_RACK_DIRECTION_BOTTOM_UP = 2;
}
message PhysicalClearance {
  // User/source-required space before the equipment's X face, in micrometres.
  uint64 before_x_um = 1;
  // User/source-required space after the equipment's X face, in micrometres.
  uint64 after_x_um = 2;
  // User/source-required space before the equipment's Y face, in micrometres.
  uint64 before_y_um = 3;
  // User/source-required space after the equipment's Y face, in micrometres.
  uint64 after_y_um = 4;
  // User/source-required space before the equipment's Z face, in micrometres.
  uint64 before_z_um = 5;
  // User/source-required space after the equipment's Z face, in micrometres.
  uint64 after_z_um = 6;
}
// Complete compatibility declaration for a selected connector interface. Matching
// exact contracts with complementary roles qualifies that declared interface only;
// designation text and different contract revisions never imply compatibility.
message PhysicalMating {
  // User/source-supplied immutable contract reference. No acquisition, issuer
  // authentication or manufacturer approval is inferred from these identifiers.
  omloom.v1.EquipmentReference profile = 1;
  // Declared side within this contract; UNSPECIFIED is invalid when present.
  PhysicalMatingRole role = 2;
}
enum PhysicalMatingRole {
  PHYSICAL_MATING_ROLE_UNSPECIFIED = 0;
  PHYSICAL_MATING_ROLE_SIDE_A = 1;
  PHYSICAL_MATING_ROLE_SIDE_B = 2;
  PHYSICAL_MATING_ROLE_SELF_MATING = 3;
}
message PhysicalDefinitionEdit {
  // User-supplied current definition, validated under resource/field permissions.
  PhysicalDefinition definition = 1;
}
enum PhysicalComponentKind {
  PHYSICAL_COMPONENT_KIND_UNSPECIFIED = 0;
  PHYSICAL_COMPONENT_KIND_CHASSIS = 1;
  PHYSICAL_COMPONENT_KIND_TRANSCEIVER = 2;
  PHYSICAL_COMPONENT_KIND_DISK = 3;
  PHYSICAL_COMPONENT_KIND_POWER_SUPPLY = 4;
  PHYSICAL_COMPONENT_KIND_NETWORK_ADAPTER = 5;
  PHYSICAL_COMPONENT_KIND_LINE_CARD = 6;
  PHYSICAL_COMPONENT_KIND_DOCK = 7;
  PHYSICAL_COMPONENT_KIND_ASSEMBLY = 8;
}
message PhysicalPositionEdit {
  // Selected actual owner; replacing that owner creates new structural positions.
  omloom.v1.AssetRef owner = 1;
  // User/source-qualified immutable structural token, 1-128 ASCII token bytes.
  // Labels, serials and enumeration indices alone do not establish this key.
  string structural_key = 2;
  // User-visible bounded label, independent of structural identity.
  string name = 3;
  // Kind of removable part admitted by this position, unspecified means unknown.
  PhysicalComponentKind component_kind = 4;
  // Exact current position revision for an edit; absent means explicit creation.
  optional uint64 expected = 5;
}
message PhysicalPosition {
  // Server-generated stable position identity, scoped structurally by its owner.
  omloom.v1.AssetRef target = 1;
  // Current actual owning incarnation, not the presently removable occupant.
  omloom.v1.AssetRef owner = 2;
  // Immutable structural identity within the actual owning incarnation.
  string structural_key = 3;
  // Current declared part class; it does not prove electrical/media compatibility.
  PhysicalComponentKind component_kind = 4;
  // Accepted position revision for a reviewed mutation.
  uint64 revision = 5;
}
message PhysicalPositionQuery {
  // Explicit actual owner whose permitted direct positions are requested.
  omloom.v1.AssetRef owner = 1;
  // Previous keyset continuation, absent on the first page; never an authority grant.
  optional string after = 2;
  // Requested page size, zero selects 25 and values above 25 are rejected.
  uint32 limit = 3;
}
message PhysicalPlacement {
  // Existing adopted part/device incarnation. Exactly one of item or material
  // is supplied; a future material never acquires a fabricated asset identity.
  omloom.v1.AssetRef item = 1;
  // Existing receiving rack/enclosure incarnation; parent authority is checked separately.
  omloom.v1.AssetRef enclosure = 2;
  // Proposed position/envelope in receiving enclosure coordinates. Admission
  // checks actual current dimensions or an unreceived unit's declared specification;
  // it cannot shrink the body to make it fit. Unknown dimensions stay unvalidated.
  PhysicalVolume volume = 3;
  // User-selected requested unit in this plan's materials. Its allocation, when
  // received, supplies the real item; callers never send both derived identities.
  PhysicalMaterialUnit material = 4;
}
message PhysicalMaterialUnit {
  // Zero-based requirement line in the same saved or transient plan.
  uint32 material = 1;
  // Zero-based unit below that line's quantity. Selecting one unit creates
  // one proposed placement, never placements for the line's entire quantity.
  uint32 unit = 2;
}
message PhysicalReplacement {
  // Selected surviving position or actual enclosure for a chassis replacement.
  omloom.v1.AssetRef position = 1;
  // Previously established part; absence leaves the predecessor unresolved,
  // never implicitly asserts that the position is empty.
  optional omloom.v1.AssetRef previous = 2;
  // Explicit new adopted part; absence records removal. Equal previous/replacement
  // records a same-part reseat, preserving the part's identity.
  optional omloom.v1.AssetRef replacement = 3;
  // Exact ordinary InstalledIn relation reviewed for previous, required with previous.
  optional string previous_binding = 4;
  // Revision of that binding, never a serial/name/time-based identity guess.
  optional uint64 previous_revision = 5;
  // Explicit old position when moving an established part or staging a chassis
  // elsewhere; omission selects the same position as the destination.
  optional omloom.v1.AssetRef source_position = 6;
  // Optional explicitly reviewed incoming placement/envelope in position's frame.
  // A rack chassis replacement requires this for reservation. It is proposal
  // geometry until reported; no old pose or physical proof is copied implicitly.
  // Report commits this pose with the new binding in the same transaction.
  optional PhysicalVolume volume = 7;
  // Explicit reviewed endpoint correspondence, at most 64 pairs across a plan.
  // It preserves intent only: no cable attachment, runtime identity, configuration
  // or grants are copied. Unmapped and rejected ports remain explicit.
  repeated PhysicalEndpointMapping endpoints = 8;
  // Server-owned current review disposition. Echo unchanged on draft saves;
  // only the review command may correct it. It never proves a physical effect.
  optional PhysicalReplacementFeedback feedback = 9;
}
enum PhysicalReplacementDecision {
  PHYSICAL_REPLACEMENT_DECISION_UNSPECIFIED = 0;
  PHYSICAL_REPLACEMENT_DECISION_CONFIRMED = 1;
  PHYSICAL_REPLACEMENT_DECISION_REJECTED = 2;
  PHYSICAL_REPLACEMENT_DECISION_DEFERRED = 3;
}
enum PhysicalReplacementStrength {
  PHYSICAL_REPLACEMENT_STRENGTH_UNSPECIFIED = 0;
  PHYSICAL_REPLACEMENT_STRENGTH_LIMITED = 1;
  PHYSICAL_REPLACEMENT_STRENGTH_CONTEXTUAL = 2;
  PHYSICAL_REPLACEMENT_STRENGTH_ESTABLISHED_IDENTITY = 3;
}
enum PhysicalReplacementReason {
  PHYSICAL_REPLACEMENT_REASON_UNSPECIFIED = 0;
  PHYSICAL_REPLACEMENT_REASON_MOVED = 1;
  PHYSICAL_REPLACEMENT_REASON_ADDITIONAL = 2;
  PHYSICAL_REPLACEMENT_REASON_RESEATED = 3;
  PHYSICAL_REPLACEMENT_REASON_SOURCE_ERROR = 4;
  PHYSICAL_REPLACEMENT_REASON_WRONG_PREDECESSOR = 5;
}
message PhysicalReplacementFeedback {
  // Operator judgment, independent of endpoint correspondence and installation.
  PhysicalReplacementDecision decision = 1;
  // Optional bounded correction category; no free-text sample corpus.
  PhysicalReplacementReason reason = 2;
  // Server fingerprint of the reviewed current evidence, not an identity proof.
  string basis = 3;
  // Server-owned correction-window deadline. Expiry never creates a new alert.
  uint64 until_ms = 4;
  // Versioned explainable rule, currently 1. No calibrated probability is claimed.
  uint32 rule = 5;
  // Server evidence class: 1 limited, 2 contextual, 3 established same-part identity.
  PhysicalReplacementStrength strength = 6;
  // Server component class used for the bounded quality bucket, not model inference.
  PhysicalComponentKind component_kind = 7;
  // Server opaque disclosure partition. Neither its possession nor a matching
  // actor name grants access; current complete scope is checked on each request.
  string scope = 8;
}
message PhysicalReplacementReview {
  // Existing plan and exact revision; no review is implicitly an installation.
  PhysicalPlanKey plan = 1;
  // Zero-based replacement step, not an arbitrary resource query.
  uint32 step = 2;
  // Absent means read-only explanation. Present explicitly records/corrects
  // one judgment, requiring the returned basis and current plan revision.
  optional PhysicalReplacementDecision decision = 3;
  // Optional bounded reason; supplied only with a decision.
  PhysicalReplacementReason reason = 4;
  // Server-returned evidence fingerprint echoed for a conditional decision.
  optional string basis = 5;
}
message PhysicalReplacementHypothesis {
  // Current evidence fingerprint for an explicit conditional review command.
  string basis = 1;
  // Version of the deterministic explanation rules, not a learned predictor.
  uint32 rule = 2;
  // Evidence-strength class, independent of compatibility and service health.
  PhysicalReplacementStrength strength = 3;
  // Server explanation of the evidence and plausible alternatives.
  string explanation = 4;
}
message PhysicalReplacementQuality {
  // Component class, rule and strength partition of actual reviewed judgments.
  PhysicalComponentKind component_kind = 1;
  // Versioned deterministic rule; counts do not establish predictor accuracy.
  uint32 rule = 2;
  // Evidence class, not a calibrated probability.
  PhysicalReplacementStrength strength = 3;
  // Current judgment class; deferred is unlabelled, never a negative example.
  PhysicalReplacementDecision decision = 4;
  // Bounded reason category, without identities, topology or raw evidence.
  PhysicalReplacementReason reason = 5;
  // Number of current contributions, replaced atomically on correction.
  uint64 count = 6;
  // End of this finite correction/aggregate window, not a permanent dataset.
  uint64 until_ms = 7;
}
message PhysicalReplacementQualityQuery {
  // Previous server-returned bucket key. It supplies no disclosure permission.
  optional string after = 1;
}
message PhysicalEndpointMapping {
  // Existing physical port directly supplied by the previous component.
  omloom.v1.AssetRef previous = 1;
  // User-selected port directly supplied by the incoming component. Absent
  // means unresolved; names, numbering and likelihood never supply this value.
  optional omloom.v1.AssetRef replacement = 2;
  // Operator's mapping judgment, independent of accepting the replacement event.
  PhysicalMappingDecision decision = 3;
  // Explicit source lane for a breakout; absent selects the entire port.
  // It must exist in the current sourced port definition before acceptance.
  optional uint32 previous_channel = 4;
  // Explicit destination lane, absent selects the entire destination port.
  // A whole-port allocation and its lane allocations cannot coexist.
  optional uint32 replacement_channel = 5;
}
enum PhysicalMappingDecision {
  PHYSICAL_MAPPING_DECISION_UNSPECIFIED = 0;
  PHYSICAL_MAPPING_DECISION_UNRESOLVED = 1;
  PHYSICAL_MAPPING_DECISION_ACCEPTED = 2;
  PHYSICAL_MAPPING_DECISION_REJECTED = 3;
}
message PhysicalEndpointMappings {
  // Bounded mappings consumed together by one replacement review, never an
  // alternative authoritative connectivity graph or an execution receipt.
  repeated PhysicalEndpointMapping pairs = 1;
}
enum PhysicalStepState {
  PHYSICAL_STEP_STATE_UNSPECIFIED = 0;
  PHYSICAL_STEP_STATE_PLANNED = 1;
  PHYSICAL_STEP_STATE_RESERVED = 2;
  PHYSICAL_STEP_STATE_RECORDED = 3;
  PHYSICAL_STEP_STATE_NOT_PERFORMED = 4;
}
enum PlanTrigger {
  PLAN_TRIGGER_UNSPECIFIED = 0;
  PLAN_TRIGGER_REPORTED = 1;
  PLAN_TRIGGER_SATISFIED = 2;
  PLAN_TRIGGER_FAILED = 3;
}
message PlanDependency {
  // Zero-based stable step index within this admitted plan revision.
  uint32 step = 1;
  // Required predecessor outcome. Unknown evidence never selects a branch.
  PlanTrigger when = 2;
}
message PlanControl {
  // Explicit serial/branch prerequisites; at most 256 edges across the plan.
  repeated PlanDependency after = 1;
  // Optional postcondition using the common requirement graph. Machine evidence
  // must qualify for this post-effect phase, not merely be an old current sample.
  optional EvaluateRequirements check = 2;
}
enum PlanReadiness {
  PLAN_READINESS_UNSPECIFIED = 0;
  PLAN_READINESS_READY = 1;
  PLAN_READINESS_WAITING = 2;
  PLAN_READINESS_UNSELECTED = 3;
  PLAN_READINESS_COMPLETE = 4;
}
message PhysicalStep {
  // Server-derived progress. New drafts may omit it or specify PLANNED only.
  // RECORDED is an attributed report, never verified connectivity or health.
  PhysicalStepState state = 1;
  // Explicit serial/branch prerequisites, at most 256 edges across the plan.
  // Empty means independent work, not an implicit dependency on list order.
  optional PlanControl control = 4;
  // Server-derived current checkpoint verdict; absent before work is reported.
  // Reports cannot set this value, and manual work is not machine verification.
  optional RequirementState checked_state = 5;
  // Current machine-readable checkpoint reason, never a caller-supplied verdict.
  optional RequirementReason checked_reason = 6;
  // Current graph result, recomputed under server permissions; never authority.
  PlanReadiness readiness = 7;
  // Exactly one transition in the shared plan and reservation lifecycle.
  oneof action {
    // Proposed geometry for a selected part in a selected enclosure.
    PhysicalPlacement placement = 2;
    // Reviewed transition preserving unaffected identities and intent.
    PhysicalReplacement replacement = 3;
    // Manual wiring transition at one named cable end, sharing plan progress,
    // prerequisite checks and reservation/reconciliation ownership.
    PhysicalWiring wiring = 8;
  }
}
enum PhysicalPlanState {
  PHYSICAL_PLAN_STATE_UNSPECIFIED = 0;
  PHYSICAL_PLAN_STATE_DRAFT = 1;
  PHYSICAL_PLAN_STATE_RESERVED = 2;
  PHYSICAL_PLAN_STATE_PARTIAL = 3;
  PHYSICAL_PLAN_STATE_COMPLETED = 4;
  PHYSICAL_PLAN_STATE_CANCELLED = 5;
}
message PhysicalPlan {
  // Server-assigned identity on explicit save; omitted for a new transient preview.
  optional string id = 1;
  // User label, max 160 UTF-8 bytes. It does not name an executable command.
  string name = 2;
  // Ordered physical transitions, at most 64; unsaved editing reserves nothing.
  repeated PhysicalStep steps = 3;
  // Server-derived current lifecycle; callers cannot assert accepted completion.
  PhysicalPlanState state = 4;
  // Server-derived saved revision, used for conditional plan changes.
  uint64 revision = 5;
  // Server-admitted reservation deadline in Unix milliseconds, absent for drafts.
  optional uint64 reserved_until_ms = 6;
  // User's plan-local material requirements, at most 64. These are not adopted
  // assets or stock promises. Quantities never allocate one record per unit.
  repeated PhysicalMaterial materials = 7;
}
message PhysicalMaterial {
  // User-visible current BOM label, 1-160 UTF-8 bytes, not a global identity.
  string name = 1;
  // Requested count of discrete units, positive uint32. Large counts do not
  // instantiate assets, positions or allocations. Receipt may be partial.
  uint32 quantity = 2;
  // Requested physical resource kind: device, physical component, cable or rack.
  omloom.v1.AssetKind kind = 3;
  // Optional selected canonical equipment claims, without serials or credentials.
  // Each field has its own source basis; at most the 12 equipment claim names.
  repeated omloom.v1.Field specifications = 4;
  // Optional plan-local physical specification using the common fact vocabulary.
  // Target must be absent. Current occupancy/power completeness assertions are
  // forbidden: proposed equipment cannot assert actual inventory or live sources.
  optional PhysicalDefinition physical = 5;
  // Explicitly received/reused adopted resources, at most 64 across one plan.
  // Each retains its real identity and current serial; no template serial is copied.
  repeated PhysicalMaterialAllocation allocations = 6;
}
message PhysicalMaterialAllocation {
  // User-selected zero-based unit within this BOM line, less than quantity.
  // Sparse receipt can name any requested unit without allocating preceding ones.
  uint32 unit = 1;
  // Actual adopted resource explicitly received or selected for reuse. This
  // reference grants nothing and does not assert installation or verified health.
  omloom.v1.AssetRef item = 2;
  // User's bounded receipt/reuse source, 1-512 UTF-8 bytes; no secrets. Manual
  // attribution is not provider verification, procurement or a financial action.
  string basis = 3;
}
message PhysicalMaterialReceipt {
  // Caller-selected saved plan and last reviewed revision, under current rights.
  PhysicalPlanKey plan = 1;
  // Zero-based material line in that saved plan, not a global stock identifier.
  uint32 material = 2;
  // Explicit actual unit and receipt/reuse source. New units may arrive partially
  // after reservation. Replacing an allocation already used by a step is forbidden.
  PhysicalMaterialAllocation allocation = 3;
}
message PhysicalPreview {
  // User-supplied proposed plan; state, revision and deadline are not authority.
  PhysicalPlan plan = 1;
}
message PhysicalSave {
  // Proposed current draft; existing plans must include their last reviewed revision.
  PhysicalPlan plan = 1;
}
message PhysicalRead {
  // Existing enclosure whose permitted physical projection is requested.
  omloom.v1.AssetRef enclosure = 1;
  // Explicit next-level installed-component projection. False reads only the
  // selected resource's facts, without traversing its children.
  bool occupants = 2;
  // Server-returned continuation for the same selected enclosure, working scope,
  // authority and inventory revision. Absent starts the first page of 25 parts.
  // At most 256 UTF-8 bytes; requires occupants=true and grants no additional access.
  optional string after = 3;
}
message PhysicalPlanKey {
  // Exact saved plan identity returned by its save command, not a capability.
  string id = 1;
  // Last reviewed plan revision; changes require a new review.
  uint64 revision = 2;
}
message PhysicalPlanList {
  // Opaque last plan key from the previous page, not an access capability.
  optional string after = 1;
  // Requested summary count, at most 25. Omission uses the fixed first-page size.
  uint32 limit = 2;
}
message PhysicalPlanSummary {
  // Server-assigned saved plan UUID; names never identify a plan.
  string id = 1;
  // Owner-visible current plan label; resource access is independently rechecked.
  string name = 2;
  // Current conditional edit basis, not execution or installation evidence.
  uint64 revision = 3;
  // Derived current plan lifecycle, independent of actual installed occupancy.
  PhysicalPlanState state = 4;
}
message PhysicalReserve {
  // Existing saved draft and revision to admit against current capacity.
  PhysicalPlanKey plan = 1;
  // Requested finite deadline, Unix milliseconds, bounded by the host policy.
  uint64 until_ms = 2;
}
message PhysicalCompletion {
  // Saved plan and reviewed revision for manual outcomes or a postcondition
  // refresh. With no outcomes, checks are refreshed without repeating work;
  // unchanged progress is not written, but newly satisfied goals can finish.
  PhysicalPlanKey plan = 1;
  // Selected zero-based step indexes actually completed, at most 64. Unselected
  // work remains unresolved; deadline and missing observation never complete it.
  repeated uint32 completed_steps = 2;
  // Operator's concise discrepancy report, max 2048 bytes; never machine verification.
  optional string discrepancy = 3;
  // Explicitly confirmed steps not performed. Only their future reservation is
  // released; installed occupancy and unresolved effects are preserved.
  repeated uint32 not_performed_steps = 4;
  // User explicitly records externally performed actual work, even if a planned
  // safe installation could not be admitted. This grants no executor authority
  // and never marks compatibility, cable connectivity or service health verified.
  bool actual_state = 5;
}
message PhysicalOccupancy {
  // Current installed placement, independent of the reservation's expiry.
  PhysicalPlacement placement = 1;
  // Attribution of the manual installation, not proof of live service or wiring.
  optional string reported_by = 2;
  // Server-returned accepted physical binding revision, used to invalidate old
  // evidence. Zero when binding is withheld by either endpoint's relationship grant.
  uint64 revision = 3;
  // Exact current installed binding, disclosed only with relationship access on
  // both endpoints. Absence supplies no permission to guess its identity/revision.
  optional omloom.v1.Relation binding = 4;
  // Geometry report revision, absent when this binding has no reported placement envelope.
  optional uint64 pose_revision = 5;
  // Geometry reporter, independent of the installed binding's source/actor.
  optional string pose_reported_by = 6;
}
message Physical {
  // Exactly one physical query or command; no caller-supplied effective grants.
  oneof action {
    // Inspect one selected enclosure without writes or reservation admission.
    PhysicalRead read = 1;
    // Conditionally refine current physical facts, not installed component state.
    PhysicalDefinitionEdit define = 2;
    // Check a transient proposal against current authoritative constraints.
    PhysicalPreview preview = 3;
    // Explicitly save a bounded current plan without reserving or installing it.
    PhysicalSave save = 4;
    // Load the saved plan under current rights, without creating a snapshot.
    PhysicalPlanKey load = 5;
    // Atomically reserve current physical capacity, without claiming installation.
    PhysicalReserve reserve = 6;
    // Record attributed actual installation and preserve unresolved allocations.
    PhysicalCompletion complete = 7;
    // Cancel future work while preserving installed occupancy and unresolved effects.
    PhysicalPlanKey cancel = 8;
    // Retrieve only the caller's saved plan summaries with bounded stable pagination.
    PhysicalPlanList list = 9;
    // Create/refine a structural position with its ordinary inventory ownership atomically.
    PhysicalPositionEdit position = 10;
    // Retrieve bounded direct positions without loading occupants or descendants.
    PhysicalPositionQuery positions = 11;
    // Create/refine one of at most 64 named cable ends; no attachment or unplugging.
    PhysicalCableEndEdit cable_end = 12;
    // Read only the selected cable's named ends, without tracing its neighbors.
    PhysicalCableEnds cable_ends = 13;
    // Save or explicitly revoke a selected-region disclosure offer. This never
    // grants resource, placement or external-operation authority.
    PhysicalOfferEdit offer = 14;
    // Read only the selected offer's permitted availability, not its occupants.
    PhysicalOfferRead availability = 15;
    // List the current actor's offers for one already selected enclosure.
    PhysicalOffers offers = 16;
    // Record one received/reused unit without installing it or completing a step.
    PhysicalMaterialReceipt receive = 17;
    // Explain or explicitly judge a replacement using current scoped evidence.
    PhysicalReplacementReview review_replacement = 18;
    // Bounded quality buckets for the exact current complete disclosure scope.
    // No topology is traversed and no narrower/global aggregate is inferred.
    PhysicalReplacementQualityQuery replacement_quality = 19;
  }
}
message PhysicalCableEnd {
  // Stable operator/source-qualified token within the exact cable incarnation,
  // 1-64 ASCII token bytes. Labels or connector types do not establish identity.
  string key = 1;
  // Current operator label, 1-128 UTF-8 bytes, independent of structural identity.
  string name = 2;
  // Operator-supplied source/measurement reference, 1-512 UTF-8 bytes; no secrets.
  string basis = 3;
  // Optional qualified connector designation, 1-128 UTF-8 bytes. This label
  // alone cannot establish medium, polarity, lane mapping or compatibility.
  optional string connector = 4;
  // Server-owned current end-record revision, not connectivity evidence.
  uint64 revision = 5;
  // Server-derived current attachment knowledge. Absence means unknown or
  // unavailable, never unplugged; mutation receipts may omit this projection.
  oneof attachment {
    // Exact accepted binding, disclosed only with both endpoints' current rights.
    PhysicalCableAttachment connected = 6;
    // Explicit attributed report of a loose end; not inferred from a missing scan.
    Empty loose = 7;
  }
  // Independently accepted expected destination, retained while unplugged or
  // uncertain. Omitted unless the caller can read this relationship and its port.
  optional omloom.v1.AssetRef intended_port = 8;
  // Optional declared connector mating contract; a display label is insufficient.
  optional PhysicalMating mating = 9;
  // Explicit operator/source-declared internal channel numbers, at most 64
  // distinct positive values up to 4096 in this cable's namespace. Equal numbers
  // at two ends describe one passive path; absent numbers leave it unknown.
  // Breakout uses several numbered paths in one assembly, never cloned cables.
  repeated uint32 channels = 10;
}
message PhysicalCableAttachment {
  // Actual port incarnation supplied by the accepted inventory binding.
  omloom.v1.AssetRef port = 1;
  // Server-generated current ConnectedTo relation UUID; not an end identity.
  string binding_id = 2;
  // Exact current attachment revision, independent of the cable's lifetime.
  uint64 binding_revision = 3;
}
message PhysicalWiring {
  // Selected retained cable incarnation, never inferred from its label or path.
  omloom.v1.AssetRef cable = 1;
  // Existing named end within this cable, 1-64 ASCII token bytes.
  string end_key = 2;
  // Exact current-state basis, or the output of an earlier wiring step at the
  // same end. A step reference contributes a dependency to the common DAG.
  oneof basis {
    // User's reviewed current end revision; zero is invalid.
    uint64 expected_end_revision = 3;
    // User-selected earlier step index; its recorded result must exist first.
    uint32 after_step = 10;
  }
  // Explicit disposition of accepted destination intent, independent of what
  // physically happened. UNSPECIFIED is rejected; no automatic intent adoption.
  PhysicalWiringIntent intent = 7;
  // Server-captured previous accepted binding for this exact admitted step.
  // It may be only possible occupancy, never proof of current signal/health.
  optional PhysicalCableAttachment previous = 8;
  // Server-captured previous intent needed for reviewed correction/recovery.
  // These output fields do not let a caller overwrite the source basis.
  optional omloom.v1.AssetRef previous_intended_port = 9;
  // Server-recorded end revision produced by this effect. It permits dependent
  // steps to continue after restart without replaying the physical work.
  optional uint64 result_revision = 11;
  // Explicit proposed/reported attachment. No state can be inferred from omission.
  oneof after {
    // Actual destination physical port; normal scope and endpoint rights apply.
    omloom.v1.AssetRef port = 4;
    // Operator confirms that this end is physically loose.
    Empty loose = 5;
    // Operator cannot establish attachment; preserves uncertainty, not free capacity.
    Empty unknown = 6;
  }
}
enum PhysicalWiringIntent {
  PHYSICAL_WIRING_INTENT_UNSPECIFIED = 0;
  PHYSICAL_WIRING_INTENT_PRESERVE = 1;
  PHYSICAL_WIRING_INTENT_ADOPT_DESTINATION = 2;
  PHYSICAL_WIRING_INTENT_CLEAR_DESTINATION = 3;
}
message PhysicalCableEndEdit {
  // Selected adopted cable incarnation; no device/port identity is inferred.
  omloom.v1.AssetRef cable = 1;
  // User's proposed end definition. Its output revision grants no authority.
  PhysicalCableEnd end = 2;
  // Last reviewed definition revision; absent means explicit creation.
  optional uint64 expected = 3;
}
message PhysicalCableEnds {
  // Exact selected cable, checked under the existing working context and rights.
  omloom.v1.AssetRef cable = 1;
  // Last returned structural token within this cable, absent for the first page.
  optional string after = 2;
}
message PhysicalOffer {
  // Server-generated UUID, absent only when explicitly creating an offer.
  optional string id = 1;
  // Actual enclosure incarnation supplying this offer, not a neighbor or model.
  omloom.v1.AssetRef enclosure = 2;
  // User-reviewed region in this enclosure's coordinates. It is the complete
  // disclosed query granularity; recipients cannot probe smaller hidden regions.
  PhysicalVolume region = 3;
  // Existing recipient identity selected by the publisher, max 128 UTF-8 bytes.
  // The authenticated context must match this identity; possession of an ID
  // or link alone supplies no authority. No SID identity is created here.
  string recipient = 4;
  // Publisher-supplied label, max 160 UTF-8 bytes, disclosed to this recipient.
  string name = 5;
  // Exact offer revision required for changing its region, recipient or state.
  uint64 revision = 6;
  // Explicit current revocation; revocation stops new disclosure, not copies
  // already obtained. Old restored state never qualifies current availability.
  bool revoked = 7;
  // Explicit additional permission to disclose the whole enclosure's mass
  // admission result. Neither the limit nor individual loads are disclosed.
  bool mass = 8;
  // Explicit additional permission to disclose the enclosure power result.
  // This does not certify independent supplies or electrical safety.
  bool power = 9;
  // Explicit additional permission to disclose the enclosure cooling result.
  // It describes declared capacity, not sensor readings or thermal certification.
  bool cooling = 10;
}
message PhysicalOfferEdit {
  // Publisher's selected current profile. Current resource/field rights and
  // exact revisions are rechecked before an atomic change.
  PhysicalOffer offer = 1;
}
message PhysicalOfferRead {
  // Server-generated offer UUID. It identifies a disclosure profile, not a grant.
  string id = 1;
}
message PhysicalOffers {
  // Existing selected enclosure for a publisher's own bounded offer list.
  omloom.v1.AssetRef enclosure = 1;
  // Last returned offer UUID, absent on the first page.
  optional string after = 2;
}
message PhysicalView {
  // Explicitly requested current replacement hypothesis, without durable writes.
  optional PhysicalReplacementHypothesis replacement_hypothesis = 14;
  // At most 25 bounded quality buckets under the exact contributing scope.
  repeated PhysicalReplacementQuality replacement_quality = 15;
  // Current application revision under which the projection was produced.
  uint64 revision = 1;
  // Permitted current definitions for this bounded selection only.
  repeated PhysicalDefinition definitions = 2;
  // Explicitly selected current plan or transient proposal, absent for enclosure reads.
  optional PhysicalPlan plan = 3;
  // Shared constraint result, never a grant, execution receipt or live health.
  RequirementState state = 4;
  // Machine-readable missing/conflicting basis without hidden occupant identities.
  RequirementReason reason = 5;
  // One page of permitted current occupants of the selected enclosure, maximum 25.
  repeated PhysicalOccupancy occupancy = 6;
  // At most 25 owner-visible plan summaries, without child or occupancy hydration.
  repeated PhysicalPlanSummary plans = 7;
  // Continuation for the same selected query. Occupant pages bind enclosure,
  // working scope, authority and revision. It supplies no resource or plan authority.
  optional string next = 8;
  // Currently permitted direct structural positions, at most 25 per query.
  repeated PhysicalPosition positions = 9;
  // Minimal permitted ordinary inventory labels for this selected response only.
  // Selected plan materials also include current permitted serial fields;
  // neither a material snapshot nor denied neighboring inventory is returned.
  repeated Item items = 10;
  // At most 25 named ends belonging to the selected cable; no attached devices
  // or neighboring cable paths are implicitly loaded or disclosed.
  repeated PhysicalCableEnd cable_ends = 11;
  // Selected permitted region profiles, at most 25. A recipient availability
  // response returns exactly its selected profile and no occupant projection.
  repeated PhysicalOffer offers = 12;
}

message Request {
  // Explicit working selector for resource details, prepared actions and every
  // inventory mutation/import. Query/export use Query roots/focus instead.
  // Absence is rejected for mutation, never interpreted as global authority.
  optional WorkingContext working = 18;
  // Exactly one user intention; no derived authorization, counts or status inputs.
  oneof command {
    // Read the host-selected synthetic actor and fixture capabilities.
    Empty identity = 1;
    // Retrieve a bounded authorized current projection, never a result snapshot.
    Query query = 2;
    // Read one exact incarnation and its authorized current evidence.
    Read read = 3;
    // Create or conditionally edit accepted fields with explicit set/clear intent.
    Write write = 4;
    // Apply a reviewed, revision-bound finite selection atomically.
    Bulk bulk = 5;
    // Create, conditionally replace or explicitly remove a typed relationship.
    Relationship relation = 6;
    // Administer local definition metadata without changing value interpretation.
    Definition definition = 7;
    // List only the definition metadata allowed by the host context.
    Empty definitions = 8;
    // Validate or atomically apply a reviewed interpretation/value migration.
    Migration migration = 9;
    // Save personal metadata or separately confirm its reviewed publication.
    SaveView save_view = 10;
    // List personally owned and explicitly published view definitions.
    Empty views = 11;
    // Prepare a bounded CSV preview or accept that exact current preview.
    Import import = 12;
    // Allocate or review changes to an explicitly scoped IP, prefix or VLAN.
    Network network = 13;
    // Change an intended interface participant without releasing the canonical IP.
    Member member = 14;
    // Export the current authorized projection under one application revision.
    Export export = 15;
    // Prepare actual context-specific creation kinds, parents and writable fields.
    Prepare prepare = 16;
    // Record or reconcile a known address without requiring allocation topology.
    Address address = 17;
    // Accept selected dated local network evidence under explicit installation authority.
    HostNetwork host_network = 19;
    // Current source/interface address facts; temporary addresses are rejected.
    InterfaceAddresses interface_addresses = 20;
    // Create inventory and its initial local address facts in one transaction.
    Create create = 21;
    // Perform a bounded read-only Proxmox probe with transient credentials.
    ObserveProxmox observe_proxmox = 22;
    // Read or conditionally change resource responsibility without changing access grants.
    Responsibility responsibility = 23;
    // Read or edit selected account metadata and independently authorized bindings.
    ExternalAccount external_account = 24;
    // Retain an owner-action request without dispatching work or releasing credentials.
    OwnerRequest owner_request = 25;
    // Export selected declarations or preview/accept a bounded atomic typed import.
    ResponsibilityTransfer responsibility_transfer = 26;
    // Review and atomically accept selected native host observations.
    HostImport host_import = 27;
    // Compare two selected identities without adopting, merging or writing.
    CompareHostIdentity compare_host_identity = 28;
    // Preview/apply/reverse an explicit bounded identity correction.
    IdentityCorrection correct_identity = 29;
    // Find bounded identity candidates within current permissions and working context.
    FindIdentityCandidates find_identity_candidates = 30;
    // Resolve a retired reference without transferring its old grants.
    ResolveIdentity resolve_identity = 31;
    // Review current/proposed VM placement without invoking an external effect.
    PrepareVmPlacement prepare_vm_placement = 32;
    // Evaluate desired conditions against permitted current facts without writes or probes.
    EvaluateRequirements evaluate_requirements = 33;
    // Query or explicitly refine physical planning through the common store boundary.
    Physical physical = 34;
    // Validate a known-address command without committing resources or a draft.
    Address preview_address = 35;
  }
}
message Reply {
  // Typed successful result. Failures use canonical gRPC Status with ErrorInfo.
  oneof result {
    // Host-selected synthetic identity; no authentication assertion is returned.
    Identity identity = 1;
    // Current filtered data and authorized count at one revision.
    Page page = 2;
    // Exact resource incarnation with separately projected source evidence.
    Detail detail = 3;
    // Committed mutation identities, or validated migration scope before commit.
    Mutation mutation = 4;
    // Visible typed definition metadata, including current interpretation generation.
    Definitions definitions = 5;
    // Visible saved definitions, including a reviewed unpublished draft where requested.
    Views views = 6;
    // Row validation results and an expiring acceptance identity only when valid.
    Preview preview = 7;
    // Bounded authorized CSV, distinguished by the requested output contract.
    Download download = 8;
    // Bounded validation coverage; never a saved migration history or partial apply.
    MigrationPreview migration_preview = 9;
    // Applicable context-specific actions under the current application revision.
    Actions actions = 10;
    // Ephemeral provider facts for explicit review, with no inventory mutation.
    ObservationPreview observation = 11;
    // Current permitted declarations and bounded effective responsibility resolution.
    ResponsibilityState responsibility = 12;
    // Permitted external-account metadata and independent decision axes.
    ExternalAccountState external_account = 13;
    // Durable owner request, approval or unverified outcome assertion.
    OwnerRequestState owner_request = 14;
    // Selected responsibility export or the result of one atomic reviewed import.
    ResponsibilityTransferState responsibility_transfer = 15;
    // Consistent bounded comparison, not a correction or authority grant.
    HostIdentityComparison host_identity_comparison = 16;
    // Derived correction effects under current field and relation rights.
    IdentityCorrectionView identity_correction = 17;
    // Accepted correction receipt, not a grant or an external effect receipt.
    IdentityCorrectionApplied identity_corrected = 18;
    // Current authorized candidates; no hidden totals or candidate persistence.
    IdentityCandidates identity_candidates = 19;
    // Explicit reference provenance and the independently authorized current target.
    ResolvedIdentity resolved_identity = 20;
    // Current authorized placement and the independently reviewed destination.
    VmPlacementReview vm_placement_review = 21;
    // Shared read-only prerequisite explanations, not operation admission.
    RequirementEvaluation requirement_evaluation = 22;
    // Bounded physical facts and plan validation over the same inventory revision.
    PhysicalView physical = 23;
    // Transient validated known-address summary, not accepted inventory.
    AddressReview address_review = 24;
  }
}

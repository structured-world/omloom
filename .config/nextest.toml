[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

# Measure retrieval without competing fixture creation in this test run.
[[profile.default.overrides]]
filter = 'test(/^projections::level_browse_(small_estate_has_bounded_latency|hundred_hosts_only_projects_one_page)$/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'test(/^responsibility::responsibility_reads_and_parent_changes_are_bounded$/)'
threads-required = "num-test-threads"
